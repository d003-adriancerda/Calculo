<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad de Reforzamiento: Funciones y Gráficas</title>
    
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #e67e22;
            --success: #27ae60;
            --danger: #e74c3c;
            --light: #ecf0f1;
            --dark: #2c3e50;
            --gray: #95a5a6;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f4f7f6; color: #333; line-height: 1.6; padding: 20px; }
        .container { max-width: 850px; margin: 0 auto; background: #fff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; }
        header { background: var(--primary); color: #fff; padding: 25px; text-align: center; }
        header h1 { font-size: 1.8rem; margin-bottom: 5px; }
        header h2 { font-size: 1.1rem; font-weight: 400; opacity: 0.9; }
        section { padding: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; }
        input { width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 6px; font-size: 1rem; margin-bottom: 10px; }
        .btn { display: inline-block; background: var(--secondary); color: #fff; padding: 12px 25px; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; font-weight: 600; transition: background 0.3s; width: 100%; margin-top: 10px; }
        .btn:hover { background: #d35400; }
        .btn:disabled { background: var(--gray); cursor: not-allowed; }
        .btn-next { background: var(--primary); }
        .btn-next:hover { background: #1a252f; }
        
        .stats-bar { display: flex; justify-content: space-between; background: #f8f9fa; padding: 10px 15px; border-radius: 8px; margin-bottom: 20px; font-weight: 600; }
        .stat-item span { color: var(--secondary); }
        .progress-container { height: 8px; background: #e0e0e0; border-radius: 4px; margin: 15px 0; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--success); width: 0%; transition: width 0.4s ease; }
        
        .question-box { margin-bottom: 20px; }
        .question-text { font-size: 1.2rem; margin-bottom: 20px; font-weight: 500; background: #fdfefe; padding: 15px; border-radius: 8px; border-left: 5px solid var(--secondary); }
        .options { display: grid; gap: 10px; }
        .option-btn { padding: 12px; background: #fff; border: 2px solid #ddd; border-radius: 8px; cursor: pointer; text-align: left; transition: all 0.2s; font-size: 1.1rem; }
        .option-btn:hover:not(.disabled) { border-color: var(--secondary); background: #fef5e7; }
        .option-btn.selected { border-color: var(--secondary); background: #fdebd0; font-weight: 600; }
        .option-btn.correct { border-color: var(--success); background: #d5f5e3; }
        .option-btn.incorrect { border-color: var(--danger); background: #fadbd8; }
        .option-btn.disabled { pointer-events: none; opacity: 0.7; }
        
        .feedback { margin-top: 15px; padding: 12px; border-radius: 6px; display: none; }
        .feedback.correct { background: #d5f5e3; color: #145a32; border: 1px solid #27ae60; }
        .feedback.incorrect { background: #fadbd8; color: #7b241c; border: 1px solid #e74c3c; }
        
        .results-box { text-align: center; }
        .score-circle { width: 120px; height: 120px; background: var(--secondary); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: 700; margin: 20px auto; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <header id="main-header">
        <h1>Actividad de Reforzamiento</h1>
        <h2>Cálculo Diferencial 2026 | Operaciones con Funciones, Gráficas, Dominio y Rango</h2>
    </header>

    <section id="registro">
        <div class="form-group">
            <label for="nombre">Nombre del Estudiante</label>
            <input type="text" id="nombre" placeholder="Tu nombre completo">
            <label for="fecha">Fecha de Realización</label>
            <input type="date" id="fecha">
        </div>
        <button class="btn" onclick="startQuiz()">Iniciar Evaluación</button>
    </section>

    <section id="actividad" class="hidden">
        <div class="stats-bar">
            <div class="stat-item">✅ <span id="correct-count">0</span></div>
            <div class="stat-item">❌ <span id="error-count">0</span>/3</div>
            <div class="stat-item">📊 <span id="progress-pct">0%</span></div>
        </div>
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div id="question-container">
            <div class="question-box">
                <p class="question-text" id="q-text"></p>
                <div class="options" id="options-container"></div>
                <div id="feedback" class="feedback"></div>
            </div>
            <button class="btn btn-next" id="btn-next" onclick="nextQuestion()" disabled>Siguiente</button>
        </div>
    </section>

    <section id="resultados" class="hidden">
        <div class="results-box">
            <h2>Resultado para <span id="student-name-display"></span></h2>
            <div class="score-circle" id="final-score">0%</div>
            <div id="personal-message" style="margin: 20px 0; font-size: 1.1rem;"></div>
            <button class="btn" onclick="location.reload()">Reiniciar Actividad</button>
        </div>
    </section>
</div>

<script>
    const questions = [
        {
            q: "¿Cuál es el dominio de la función $f(x) = x^2 - 4$?",
            options: ["$(-\\infty, \\infty)$", "$[-4, \\infty)$", "$(-\\infty, 4]$", "$(-\\infty, -2) \\cup (2, \\infty)$"],
            correct: 0,
            explanation: "Al ser una función polinómica (cuadrática), no tiene restricciones de división por cero ni raíces pares de negativos. Su dominio son todos los números reales."
        },
        {
            q: "¿Cuál es el rango de la función $g(x) = \\sqrt{x - 1} + 2$?",
            options: ["$[1, \\infty)$", "$(-\\infty, 2]$", "$[2, \\infty)$", "$(-\\infty, \\infty)$"],
            correct: 2,
            explanation: "La raíz cuadrada principal siempre devuelve un valor no negativo ($\\ge 0$). Al sumar 2 a ese resultado, el valor mínimo posible es 2. Por lo tanto, el rango es $[2, \\infty)$."
        },
        {
            q: "Determine el dominio de la función racional $h(x) = \\dfrac{3}{x + 2}$.",
            options: ["$(-\\infty, \\infty)$", "$(-2, \\infty)$", "$(-\\infty, 2) \\cup (2, \\infty)$", "$(-\\infty, -2) \\cup (-2, \\infty)$"],
            correct: 3,
            explanation: "El denominador no puede ser cero. Resolviendo $x + 2 \\neq 0$, obtenemos $x \\neq -2$. El dominio son todos los reales excepto el -2."
        },
        {
            q: "Sea $f(x) = \\begin{cases} -x & \\text{si } x < 0 \\\\ x^2 & \\text{si } x \\ge 0 \\end{cases}$. ¿Cuánto vale $f(-3) + f(2)$?",
            options: ["7", "1", "5", "-1"],
            correct: 0,
            explanation: "Para $x = -3 < 0$, usamos $f(x) = -x \\Rightarrow f(-3) = -(-3) = 3$. Para $x = 2 \\ge 0$, usamos $f(x) = x^2 \\Rightarrow f(2) = 2^2 = 4$. La suma es $3 + 4 = 7$."
        },
        {
            q: "¿Cuál es el rango de la función a tramos $f(x) = \\begin{cases} -x & \\text{si } x < 0 \\\\ x^2 & \\text{si } x \\ge 0 \\end{cases}$?",
            options: ["$(-\\infty, \\infty)$", "$[0, \\infty)$", "$(-\\infty, 0]$", "$(0, \\infty)$"],
            correct: 1,
            explanation: "Para $x < 0$, la expresión $-x$ genera valores en $(0, \\infty)$. Para $x \\ge 0$, la expresión $x^2$ genera valores en $[0, \\infty)$. La unión de ambos conjuntos es $[0, \\infty)$."
        },
        {
            q: "Sean $f(x) = x^2 + 1$ y $g(x) = 3x - 2$. ¿Cuál es la regla de la función suma $(f + g)(x)$?",
            options: ["$x^2 - 3x + 3$", "$3x^3 - 2x^2 + 3x - 2$", "$x^2 + 3x - 1$", "$x^2 + 3x + 3$"],
            correct: 2,
            explanation: "Sumamos las expresiones algebraicas directamente: $(x^2 + 1) + (3x - 2) = x^2 + 3x - 1$."
        },
        {
            q: "Determine el dominio del cociente $\\left(\\dfrac{f}{g}\\right)(x)$ donde $f(x) = x^2 + 1$ y $g(x) = 3x - 2$.",
            options: ["$(-\\infty, \\infty)$", "$(-\\infty, 2/3) \\cup (2/3, \\infty)$", "$(-\\infty, -2/3) \\cup (-2/3, \\infty)$", "$[2/3, \\infty)$"],
            correct: 1,
            explanation: "En un cociente, el denominador no puede ser cero: $3x - 2 \\neq 0 \\Rightarrow 3x \\neq 2 \\Rightarrow x \\neq 2/3$. El dominio son todos los reales excepto $2/3$."
        },
        {
            q: "Determine el dominio del cociente $\\left(\\dfrac{f}{g}\\right)(x)$ donde $f(x) = \\sqrt{x + 3}$ y $g(x) = x^2 - 1$.",
            options: ["$[-3, \\infty)$", "$(-3, 1) \\cup (1, \\infty)$", "$[-3, -1) \\cup (-1, 1) \\cup (1, \\infty)$", "$(-\\infty, -1) \\cup (-1, 1) \\cup (1, \\infty)$"],
            correct: 2,
            explanation: "La raíz requiere $x + 3 \\ge 0 \\Rightarrow x \\ge -3$. El denominador requiere $x^2 - 1 \\neq 0 \\Rightarrow x \\neq 1$ y $x \\neq -1$. Intersectando ambas condiciones: $[-3, \\infty)$ excluyendo $1$ y $-1$."
        },
        {
            q: "Dadas $R(t) = 2t + 5$ (ingresos) y $S(t) = t^2$ (gastos), ¿cuál es el valor de $D(3)$ si $D(t) = R(t) - S(t)$?",
            options: ["-2", "11", "9", "2"],
            correct: 3,
            explanation: "Evaluamos cada función en $t=3$: $R(3) = 2(3) + 5 = 11$ y $S(3) = 3^2 = 9$. Entonces $D(3) = 11 - 9 = 2$."
        },
        {
            q: "¿Qué interpreta el resultado $D(3) = 2$ en el contexto del problema anterior?",
            options: ["Hay un déficit de 2 unidades en el año 3.", "Hay un superávit de 2 unidades en el año 3.", "Los ingresos son 2 unidades menores que los gastos.", "El gasto total en el año 3 es de 2 unidades."],
            correct: 1,
            explanation: "Dado que $D(t) = \\text{Ingresos} - \\text{Gastos}$, un valor positivo (2) indica que los ingresos superan a los gastos, lo que en economía se denomina superávit."
        },
        {
            q: "Encuentre el dominio de la función $k(x) = \\sqrt{5 - 2x}$.",
            options: ["$[5/2, \\infty)$", "$(-\\infty, 5/2]$", "$(5/2, \\infty)$", "$(-\\infty, 5/2)$"],
            correct: 1,
            explanation: "El radicando de una raíz par debe ser no negativo: $5 - 2x \\ge 0 \\Rightarrow 5 \\ge 2x \\Rightarrow x \\le 5/2$. En notación de intervalo: $(-\\infty, 5/2]$."
        },
        {
            q: "Sea $g(x) = \\begin{cases} x + 1 & \\text{si } x < -1 \\\\ 2 & \\text{si } -1 \\le x < 2 \\\\ -x + 5 & \\text{si } x \\ge 2 \\end{cases}$. ¿Cuánto vale $g(-2) + g(2)$?",
            options: ["1", "2", "3", "4"],
            correct: 1,
            explanation: "Para $x = -2$ (que es $< -1$), $g(-2) = -2 + 1 = -1$. Para $x = 2$ (que es $\\ge 2$), $g(2) = -2 + 5 = 3$. La suma es $-1 + 3 = 2$."
        }
    ];

    let currentQ = 0;
    let correctCount = 0;
    let errorCount = 0;
    let studentName = "";
    let answered = false;

    // Establecer fecha de hoy por defecto
    document.getElementById('fecha').valueAsDate = new Date();

    function startQuiz() {
        const nameInput = document.getElementById('nombre').value.trim();
        const dateInput = document.getElementById('fecha').value;
        if(!nameInput || !dateInput) return alert("Por favor, ingresa tu nombre y la fecha.");
        studentName = nameInput;
        document.getElementById('registro').classList.add('hidden');
        document.getElementById('actividad').classList.remove('hidden');
        loadQuestion();
    }

    function loadQuestion() {
        answered = false;
        const q = questions[currentQ];
        document.getElementById('q-text').innerHTML = `<strong>Pregunta ${currentQ + 1}:</strong><br>${q.q}`;
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        
        q.options.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = opt;
            btn.onclick = () => selectOption(i, btn);
            container.appendChild(btn);
        });
        document.getElementById('feedback').style.display = 'none';
        document.getElementById('btn-next').disabled = true;
        updateStats();
        MathJax.typesetPromise();
    }

    function selectOption(index, btn) {
        if(answered) return;
        document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        document.getElementById('btn-next').disabled = false;
        btn.dataset.index = index;
    }

    function nextQuestion() {
        if(!answered) {
            const selected = document.querySelector('.option-btn.selected');
            const idx = parseInt(selected.dataset.index);
            checkAnswer(idx);
            answered = true;
            document.getElementById('btn-next').innerText = (currentQ < questions.length - 1) ? "Siguiente Pregunta" : "Finalizar";
            MathJax.typesetPromise();
        } else {
            currentQ++;
            if(currentQ < questions.length) {
                loadQuestion();
                document.getElementById('btn-next').innerText = "Siguiente";
            } else {
                showResults();
            }
        }
    }

    function checkAnswer(selectedIdx) {
        const q = questions[currentQ];
        const isCorrect = selectedIdx === q.correct;
        const feedback = document.getElementById('feedback');
        const btns = document.querySelectorAll('.option-btn');

        btns.forEach(b => b.classList.add('disabled'));
        btns[q.correct].classList.add('correct');

        if(isCorrect) {
            correctCount++;
            feedback.className = "feedback correct";
            feedback.innerHTML = "<strong>¡Excelente!</strong> " + q.explanation;
        } else {
            errorCount++;
            btns[selectedIdx].classList.add('incorrect');
            feedback.className = "feedback incorrect";
            feedback.innerHTML = "<strong>Incorrecto.</strong> " + q.explanation;
            
            if(errorCount >= 3) {
                setTimeout(() => {
                    alert("Has acumulado 3 errores. Te recomendamos repasar los conceptos de dominio, rango y operaciones con funciones antes de volver a intentarlo.");
                    location.reload();
                }, 1500);
            }
        }
        feedback.style.display = 'block';
        updateStats();
    }

    function updateStats() {
        document.getElementById('correct-count').innerText = correctCount;
        document.getElementById('error-count').innerText = errorCount;
        const prog = Math.round((currentQ / questions.length) * 100);
        document.getElementById('progress-pct').innerText = prog + "%";
        document.getElementById('progress-bar').style.width = prog + "%";
    }

    function showResults() {
        document.getElementById('actividad').classList.add('hidden');
        document.getElementById('resultados').classList.remove('hidden');
        document.getElementById('student-name-display').innerText = studentName;
        const score = Math.round((correctCount / questions.length) * 100);
        document.getElementById('final-score').innerText = score + "%";
        
        let msg = score >= 80 ? "¡Excelente trabajo! Dominas los conceptos de funciones, sus gráficas y operaciones a la perfección." : "Buen esfuerzo. Te recomendamos repasar las restricciones de dominio (raíces y denominadores) y la evaluación de funciones a tramos.";
        document.getElementById('personal-message').innerText = msg;
    }
</script>
</body>
</html>
