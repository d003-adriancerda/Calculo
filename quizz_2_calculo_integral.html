<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuestionario: Reglas de Derivación (Sesión 2)</title>
    <style>
        :root {
            --primary-color: #1e3a8a;
            --secondary-color: #3b82f6;
            --success-color: #10b981;
            --error-color: #ef4444;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }

        .quiz-container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            padding: 30px;
            margin: auto;
            box-sizing: border-box;
        }

        h1 {
            color: var(--primary-color);
            font-size: 1.6rem;
            text-align: center;
            margin-top: 0;
            margin-bottom: 5px;
        }

        h2 {
            font-size: 0.9rem;
            color: #6b7280;
            text-align: center;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Formulario de registro */
        .register-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        .register-form label {
            font-weight: 600;
            font-size: 1rem;
            color: var(--text-color);
        }

        .register-form input {
            padding: 12px;
            font-size: 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }

        .register-form input:focus {
            border-color: var(--secondary-color);
        }

        .progress-bar-container {
            background-color: #e5e7eb;
            border-radius: 10px;
            height: 10px;
            width: 100%;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-bar {
            background-color: var(--secondary-color);
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
        }

        .question {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: #f9fafb;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            padding: 15px;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        .option-btn:hover:not([disabled]) {
            background-color: #eff6ff;
            border-color: var(--secondary-color);
        }

        .option-btn.correct {
            background-color: #d1fae5;
            border-color: var(--success-color);
            color: #065f46;
            font-weight: bold;
        }

        .option-btn.incorrect {
            background-color: #fee2e2;
            border-color: var(--error-color);
            color: #991b1b;
        }

        .feedback {
            margin-top: 20px;
            font-weight: 600;
            text-align: center;
            min-height: 24px;
        }

        .next-btn {
            display: block;
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 25px;
            transition: background-color 0.2s;
        }

        .next-btn:hover {
            background-color: #172554;
        }

        .next-btn:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }

        .result-container {
            text-align: center;
        }

        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: #eff6ff;
            border: 4px solid var(--secondary-color);
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px auto;
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <!-- PANTALLA 1: REGISTRO -->
    <div id="register-screen">
        <h1>Cálculo Integral</h1>
        <p style="text-align: center; color: #4b5563;">Ingresa tus datos para iniciar la evaluación práctica de la Sesión 2 <br> (Reglas de Derivación).</p>
        
        <div class="register-form">
            <label for="student-name">Nombre Completo:</label>
            <input type="text" id="student-name" placeholder="Ej. Juan Pérez" autocomplete="off">
            <button class="next-btn" id="start-button" style="margin-top: 10px;">Comenzar Cuestionario</button>
        </div>
    </div>

    <!-- PANTALLA 2: CUESTIONARIO -->
    <div id="quiz-screen" class="hidden">
        <h1>Cálculo Integral</h1>
        <h2 id="quiz-subtitle">Sesión 2: Reglas de Derivación</h2>
        
        <div class="progress-bar-container">
            <div class="progress-bar" id="progress"></div>
        </div>

        <div class="question" id="question-text">Cargando pregunta...</div>
        
        <div class="options-container" id="options">
            <!-- Botones de opciones dinámicas -->
        </div>

        <div class="feedback" id="feedback"></div>
        
        <button class="next-btn" id="next-button" disabled>Siguiente Pregunta</button>
    </div>

    <!-- PANTALLA 3: RESULTADOS -->
    <div id="result-screen" class="hidden">
        <h1>¡Cuestionario Completado!</h1>
        <h2 id="result-user-greeting">Resultados</h2>
        <div class="score-circle" id="score-text">0/10</div>
        <p id="evaluation-comment" style="line-height: 1.5; font-size: 1.1rem; padding: 0 10px;"></p>
        <button class="next-btn" onclick="resetQuiz()">Volver a intentar</button>
    </div>
</div>

<script>
    const quizData = [
        {
            question: "Encuentre la derivada de f(x) = 5 / x³ utilizando la regla de la potencia.",
            options: [
                "f'(x) = -15 / x⁴",
                "f'(x) = 15 / x²",
                "f'(x) = -15 / x²",
                "f'(x) = -5 / (3x²)"
            ],
            correct: 0
        },
        {
            question: "Determine la derivada de la función f(x) = x² e^x aplicando la regla del producto.",
            options: [
                "f'(x) = 2x e^x",
                "f'(x) = x e^x (x + 2)",
                "f'(x) = x² e^(x-1)",
                "f'(x) = e^x (x² + 1)"
            ],
            correct: 1
        },
        {
            question: "Aplique la regla del cociente para obtener la derivada de f(x) = (e^x) / x².",
            options: [
                "f'(x) = [ e^x (x - 2) ] / x³",
                "f'(x) = e^x / (2x)",
                "f'(x) = [ e^x (x + 2) ] / x⁴",
                "f'(x) = [ x e^x - 2 ] / x²"
            ],
            correct: 0
        },
        {
            question: "Calcule la derivada de f(x) = x cos(x).",
            options: [
                "f'(x) = cos(x) - x sen(x)",
                "f'(x) = -sen(x)",
                "f'(x) = cos(x) + x sen(x)",
                "f'(x) = x sen(x) - cos(x)"
            ],
            correct: 0
        },
        {
            question: "Utilice la regla de la cadena para hallar la derivada de la función compuesta f(x) = (3x² + 5)⁴.",
            options: [
                "f'(x) = 12(3x² + 5)³",
                "f'(x) = 24x(3x² + 5)³",
                "f'(x) = 4(6x)³",
                "f'(x) = 24(3x² + 5)⁴"
            ],
            correct: 1
        },
        {
            question: "Determine la derivada de la función exponencial f(x) = e^(sen(x)) usando la regla de la cadena.",
            options: [
                "f'(x) = cos(x) e^(sen(x))",
                "f'(x) = e^(cos(x))",
                "f'(x) = -cos(x) e^(sen(x))",
                "f'(x) = sen(x) e^(sen(x)-1)"
            ],
            correct: 0
        },
        {
            question: "Encuentre la derivada de la función logarítmica f(x) = ln(x³ + 1).",
            options: [
                "f'(x) = 3x² / (x³ + 1)",
                "f'(x) = 1 / (x³ + 1)",
                "f'(x) = 3x / (x² + 1)",
                "f'(x) = 3x² ln(x³ + 1)"
            ],
            correct: 0
        },
        {
            question: "Derive de forma simplificada la función f(x) = tan(x) = sen(x) / cos(x) mediante la regla del cociente.",
            options: [
                "f'(x) = csc²(x)",
                "f'(x) = sec²(x)",
                "f'(x) = -sec²(x)",
                "f'(x) = sec(x) tan(x)"
            ],
            correct: 1
        },
        {
            question: "¿Cuál es la derivada de la función trigonométrica inversa f(x) = arctan(2x)?",
            options: [
                "f'(x) = 2 / (1 + 4x²)",
                "f'(x) = 1 / (1 + 2x²)",
                "f'(x) = 2 / (1 + 2x²)",
                "f'(x) = 1 / (1 + 4x²)"
            ],
            correct: 0
        },
        {
            question: "Dada la ecuación de la circunferencia x² + y² = 25, donde 'y' es una función implícita de 'x', halle la derivada dy/dx.",
            options: [
                "dy/dx = x / y",
                "dy/dx = -x / y",
                "dy/dx = -y / x",
                "dy/dx = -2x"
            ],
            correct: 1
        }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let hasAnswered = false;
    let userName = "";

    // Elementos de Pantallas
    const registerScreen = document.getElementById("register-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const resultScreen = document.getElementById("result-screen");

    // Elementos de Registro
    const studentNameInput = document.getElementById("student-name");
    const startButton = document.getElementById("start-button");

    // Elementos de Juego
    const questionText = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options");
    const progressBar = document.getElementById("progress");
    const nextButton = document.getElementById("next-button");
    const feedback = document.getElementById("feedback");
    const quizSubtitle = document.getElementById("quiz-subtitle");

    // Elementos de Resultado
    const resultUserGreeting = document.getElementById("result-user-greeting");
    const scoreText = document.getElementById("score-text");
    const evaluationComment = document.getElementById("evaluation-comment");

    // EVENTO 1: Iniciar cuestionario tras validación de nombre
    startButton.addEventListener("click", () => {
        const inputName = studentNameInput.value.trim();
        if (inputName === "") {
            alert("Por favor, ingresa tu nombre completo para comenzar.");
            return;
        }
        userName = inputName;
        
        // Transición de pantalla
        registerScreen.classList.add("hidden");
        quizScreen.classList.remove("hidden");
        
        // Personalizar subtítulo del cuestionario
        quizSubtitle.innerText = `Evaluación de ${userName}`;
        
        loadQuestion();
    });

    function loadQuestion() {
        hasAnswered = false;
        nextButton.disabled = true;
        nextButton.innerText = "Siguiente Pregunta";
        feedback.innerText = "";
        
        const currentQuestion = quizData[currentQuestionIndex];
        questionText.innerText = `${currentQuestionIndex + 1}. ${currentQuestion.question}`;
        
        // Actualizar barra de progreso
        const progressPercent = (currentQuestionIndex / quizData.length) * 100;
        progressBar.style.width = `${progressPercent}%`;

        optionsContainer.innerHTML = "";
        currentQuestion.options.forEach((option, index) => {
            const button = document.createElement("button");
            button.classList.add("option-btn");
            button.innerText = option;
            button.addEventListener("click", () => selectOption(index, button));
            optionsContainer.appendChild(button);
        });
    }

    function selectOption(selectedIndex, selectedButton) {
        if (hasAnswered) return;
        hasAnswered = true;

        const currentQuestion = quizData[currentQuestionIndex];
        const buttons = optionsContainer.getElementsByClassName("option-btn");

        for (let btn of buttons) {
            btn.disabled = true;
        }

        if (selectedIndex === currentQuestion.correct) {
            selectedButton.classList.add("correct");
            feedback.innerText = "¡Correcto! Aplicación de regla impecable.";
            feedback.style.color = "var(--success-color)";
            score++;
        } else {
            selectedButton.classList.add("incorrect");
            buttons[currentQuestion.correct].classList.add("correct");
            feedback.innerText = "Incorrecto. Analiza detenidamente la estructura algebraica.";
            feedback.style.color = "var(--error-color)";
        }

        nextButton.disabled = false;
        if (currentQuestionIndex === quizData.length - 1) {
            nextButton.innerText = "Ver Resultados";
        }
    }

    nextButton.addEventListener("click", () => {
        currentQuestionIndex++;
        if (currentQuestionIndex < quizData.length) {
            loadQuestion();
        } else {
            showResults();
        }
    });

    // EVENTO 2: Mostrar resultados con retroalimentación personalizada
    function showResults() {
        progressBar.style.width = "100%";
        quizScreen.classList.add("hidden");
        resultScreen.classList.remove("hidden");
        
        resultUserGreeting.innerText = `Estudiante: ${userName}`;
        scoreText.innerText = `${score}/${quizData.length}`;

        // Lógica de retroalimentación dirigida por nombre
        if (score === 10) {
            evaluationComment.innerHTML = `<strong>¡Sobresaliente, ${userName}!</strong> Has demostrado un dominio absoluto de las reglas de derivación (potencia, producto, cociente, cadena y trascendentes) sin titubear. Tu nivel operativo está listo para enfrentar retos de optimización avanzada.`;
        } else if (score >= 7) {
            evaluationComment.innerHTML = `<strong>¡Muy bien hecho, ${userName}!</strong> Posees una excelente capacidad para identificar la estructura de las funciones y seleccionar la regla matemática correcta. Solo vigila los pequeños pasos de simplificación algebraica.`;
        } else {
            evaluationComment.innerHTML = `<strong>Es buen momento para repasar, ${userName}.</strong> El éxito en Cálculo Integral depende críticamente de que sepas derivar con rapidez y de memoria de un solo paso. Te recomendamos repasar el formulario fundamental antes de continuar con la siguiente unidad.`;
        }
    }

    function resetQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        resultScreen.classList.add("hidden");
        studentNameInput.value = "";
        registerScreen.classList.remove("hidden");
    }
</script>
</body>
</html>
