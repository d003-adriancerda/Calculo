<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad de Reforzamiento: Continuidad</title>
    
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #e67e22;
            --success: #27ae60;
            --danger: #e74c3c;
            --gray: #95a5a6;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f4f7f6; color: #333; line-height: 1.6; padding: 20px; }
        .container { max-width: 850px; margin: 0 auto; background: #fff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; }
        header { background: var(--primary); color: #fff; padding: 25px; text-align: center; }
        header h1 { font-size: 1.8rem; margin-bottom: 5px; }
        header h2 { font-size: 1.1rem; font-weight: 400; opacity: 0.9; }
        section { padding: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; }
        input[type="text"], input[type="date"] { width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 6px; font-size: 1rem; margin-bottom: 10px; box-sizing: border-box; }
        .btn { display: inline-block; background: var(--secondary); color: #fff; padding: 12px 25px; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; font-weight: 600; transition: background 0.3s; width: 100%; margin-top: 10px; }
        .btn:hover { background: #d35400; }
        .btn:disabled { background: var(--gray); cursor: not-allowed; }
        .btn-next { background: var(--primary); }
        .btn-next:hover { background: #1a252f; }
        
        .stats-bar { display: flex; justify-content: space-between; background: #f8f9fa; padding: 10px 15px; border-radius: 8px; margin-bottom: 20px; font-weight: 600; flex-wrap: wrap; gap: 10px; }
        .stat-item span { color: var(--secondary); }
        .progress-container { height: 8px; background: #e0e0e0; border-radius: 4px; margin: 15px 0; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--success); width: 0%; transition: width 0.4s ease; }
        
        .question-box { margin-bottom: 20px; }
        .question-text { font-size: 1.2rem; margin-bottom: 20px; font-weight: 500; background: #fdfefe; padding: 15px; border-radius: 8px; border-left: 5px solid var(--secondary); }
        .options { display: grid; gap: 10px; }
        .option-btn { padding: 12px; background: #fff; border: 2px solid #ddd; border-radius: 8px; cursor: pointer; text-align: left; transition: all 0.2s; font-size: 1.1rem; width: 100%; }
        .option-btn:hover:not(.disabled) { border-color: var(--secondary); background: #fef5e7; }
        .option-btn.selected { border-color: var(--secondary); background: #fdebd0; font-weight: 600; }
        .option-btn.correct { border-color: var(--success); background: #d5f5e3; }
        .option-btn.incorrect { border-color: var(--danger); background: #fadbd8; }
        .option-btn.disabled { pointer-events: none; opacity: 0.7; }
        
        .feedback { margin-top: 15px; padding: 12px; border-radius: 6px; display: none; }
        .feedback.correct { background: #d5f5e3; color: #145a32; border: 1px solid #27ae60; }
        .feedback.incorrect { background: #fadbd8; color: #7b241c; border: 1px solid #e74c3c; }
        
        .results-box { text-align: center; }
        .score-circle { width: 120px; height: 120px; background: var(--secondary); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: 700; margin: 20px auto; }
        .hidden { display: none !important; }
        
        @media (max-width: 600px) {
            body { padding: 10px; }
            section { padding: 15px; }
            .option-btn { font-size: 1rem; padding: 10px; }
            .stats-bar { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Actividad de Reforzamiento</h1>
        <h2>Cálculo Diferencial | Continuidad de Funciones</h2>
    </header>

    <section id="registro">
        <div class="form-group">
            <label for="nombre">Nombre del Estudiante</label>
            <input type="text" id="nombre" placeholder="Tu nombre completo">
            <label for="fecha">Fecha de Realización</label>
            <input type="date" id="fecha">
        </div>
        <button class="btn" onclick="startQuiz()">Iniciar Evaluación</button>
    </section>

    <section id="actividad" class="hidden">
        <div class="stats-bar">
            <div class="stat-item">✅ <span id="correct-count">0</span></div>
            <div class="stat-item">❌ <span id="error-count">0</span>/10</div>
            <div class="stat-item">📊 <span id="progress-pct">0%</span></div>
        </div>
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div id="question-container">
            <div class="question-box">
                <p class="question-text" id="q-text"></p>
                <div class="options" id="options-container"></div>
                <div id="feedback" class="feedback"></div>
            </div>
            <button class="btn btn-next" id="btn-next" onclick="nextQuestion()" disabled>Siguiente</button>
        </div>
    </section>

    <section id="resultados" class="hidden">
        <div class="results-box">
            <h2>Resultado para <span id="student-name-display"></span></h2>
            <div class="score-circle" id="final-score">0%</div>
            <div id="personal-message" style="margin: 20px 0; font-size: 1.1rem;"></div>
            <button class="btn" onclick="location.reload()">Reiniciar Actividad</button>
        </div>
    </section>
</div>

<script>
    // 20 reactivos tomados de los ejercicios propuestos de CONTINUIDAD
    const questions = [
        // ==================== SECCIÓN 1: Verificar continuidad ====================
        {
            q: "¿Es $f(x) = x^2$ continua en $x = 2$?",
            options: ["Sí, porque es polinomial y todo polinomio es continuo en $\\mathbb{R}$", "No, porque el límite no existe", "Sí, pero solo por la derecha", "No, porque tiene una asíntota vertical"],
            correct: 0,
            explanation: "Las funciones polinomiales como $x^2$ son continuas en todo $\\mathbb{R}$. Evaluando: $f(2)=4$, $\\lim_{x\\to2}x^2=4$, coinciden."
        },
        {
            q: "¿Es $f(x) = 3x + 1$ continua en $x = 0$?",
            options: ["Sí, es una función lineal, continua en todo $\\mathbb{R}$", "No, porque $f(0)=1$ pero el límite no existe", "Sí, pero solo por la izquierda", "No, porque tiene una discontinuidad removible"],
            correct: 0,
            explanation: "Las funciones lineales son polinomios y por tanto continuas en todo su dominio. $f(0)=1$ y $\\lim_{x\\to0}(3x+1)=1$."
        },
        {
            q: "¿Es $f(x) = x^2 - 3x + 2$ continua en $x = 1$?",
            options: ["Sí, es polinomial", "No, porque $f(1)=0$", "Sí, pero solo por la derecha", "No, porque tiene una asíntota vertical"],
            correct: 0,
            explanation: "Es un polinomio, por lo tanto es continuo en todo $\\mathbb{R}$. Evaluando: $f(1)=1-3+2=0$, y el límite también es 0."
        },
        {
            q: "¿Es $f(x) = \\sqrt{x}$ continua en $x = 4$?",
            options: ["Sí, $\\sqrt{x}$ es continua en $[0,\\infty)$", "No, porque la raíz no está definida en 4", "Sí, pero solo por la derecha", "No, porque tiene una discontinuidad removible"],
            correct: 0,
            explanation: "La función raíz cuadrada es continua en todo su dominio $[0,\\infty)$. En $x=4$, $f(4)=2$ y $\\lim_{x\\to4}\\sqrt{x}=2$."
        },
        {
            q: "¿Es $f(x) = e^x$ continua en $x = 0$?",
            options: ["Sí, la función exponencial es continua en todo $\\mathbb{R}$", "No, porque $e^0=1$", "Sí, pero solo por la derecha", "No, porque tiene una asíntota vertical"],
            correct: 0,
            explanation: "La función exponencial $e^x$ es continua en todo $\\mathbb{R}$. En $x=0$, $f(0)=1$ y $\\lim_{x\\to0}e^x=1$."
        },
        {
            q: "¿Es $f(x) = \\sin(x)$ continua en $x = \\pi/2$?",
            options: ["Sí, la función seno es continua en todo $\\mathbb{R}$", "No, porque $\\sin(\\pi/2)=1$", "Sí, pero solo por la derecha", "No, porque tiene una discontinuidad infinita"],
            correct: 0,
            explanation: "La función seno es continua en todo $\\mathbb{R}$. En $x=\\pi/2$, $f(\\pi/2)=1$ y el límite también es 1."
        },

        // ==================== SECCIÓN 2: Identificar tipo de discontinuidad ====================
        {
            q: "$f(x) = \\dfrac{1}{x}$ en $x = 0$. ¿Qué tipo de discontinuidad presenta?",
            options: ["Infinita (asintótica)", "Removible", "De salto", "No tiene discontinuidad"],
            correct: 0,
            explanation: "Cuando $x\\to0$, el denominador tiende a 0, por lo que $f(x)\\to\\pm\\infty$. Esto produce una asíntota vertical en $x=0$, una discontinuidad infinita."
        },
        {
            q: "$f(x) = \\dfrac{x^2 - 1}{x - 1}$ en $x = 1$. ¿Qué tipo de discontinuidad presenta?",
            options: ["Removible", "Infinita", "De salto", "Es continua"],
            correct: 0,
            explanation: "Factorizando: $\\frac{(x-1)(x+1)}{x-1}=x+1$ para $x\\neq1$. El límite cuando $x\\to1$ es 2, pero $f(1)$ no existe. Es una discontinuidad removible (agujero)."
        },
        {
            q: "La función valor absoluto $f(x) = |x|$ en $x = 0$. ¿Es continua o discontinua?",
            options: ["Continua, porque $\\lim_{x\\to0}|x|=0=f(0)$", "Discontinua de salto", "Discontinua removible", "Discontinua infinita"],
            correct: 0,
            explanation: "$|x|$ es continua en todo $\\mathbb{R}$. En $x=0$, $f(0)=0$, y ambos límites laterales son 0. Aunque tiene un 'pico', es continua."
        },
        {
            q: "$f(x) = \\dfrac{x}{x}$ en $x = 0$. ¿Qué tipo de discontinuidad presenta?",
            options: ["Removible", "Infinita", "De salto", "No tiene discontinuidad"],
            correct: 0,
            explanation: "$\\frac{x}{x}=1$ para $x\\neq0$. El límite cuando $x\\to0$ es 1, pero $f(0)$ no existe (0/0). Es una discontinuidad removible."
        },
        {
            q: "$f(x) = \\tan(x)$ en $x = \\pi/2$. ¿Qué tipo de discontinuidad presenta?",
            options: ["Infinita", "Removible", "De salto", "Es continua"],
            correct: 0,
            explanation: "$\\tan(x)=\\frac{\\sin(x)}{\\cos(x)}$. En $x=\\pi/2$, $\\cos(\\pi/2)=0$, por lo que la función tiende a $\\pm\\infty$. Es una discontinuidad infinita (asíntota vertical)."
        },
        {
            q: "$f(x) = \\dfrac{x^3 - 8}{x - 2}$ en $x = 2$. ¿Qué tipo de discontinuidad presenta?",
            options: ["Removible", "Infinita", "De salto", "Es continua"],
            correct: 0,
            explanation: "Factorizando: $x^3-8=(x-2)(x^2+2x+4)$. Simplificando: $x^2+2x+4$ para $x\\neq2$. El límite es 12 pero $f(2)$ no existe. Es removible."
        },

        // ==================== SECCIÓN 3: Funciones a trozos ====================
        {
            q: "$f(x) = \\begin{cases} x+1 & x<1 \\\\ 2 & x=1 \\\\ x & x>1 \\end{cases}$ en $x=1$. ¿Es continua?",
            options: ["No, porque $\\lim_{x\\to1^-}=2$, $\\lim_{x\\to1^+}=1$ y no coinciden", "Sí, porque $f(1)=2$", "Sí, porque todos los límites existen", "No, porque $f(1)$ no existe"],
            correct: 0,
            explanation: "Límite por izquierda: $\\lim_{x\\to1^-}(x+1)=2$. Límite por derecha: $\\lim_{x\\to1^+}x=1$. No coinciden, por lo tanto no es continua (salto)."
        },
        {
            q: "$f(x) = \\begin{cases} 2x & x<0 \\\\ x^2 & x\\ge0 \\end{cases}$ en $x=0$. ¿Es continua?",
            options: ["Sí, porque $\\lim_{x\\to0^-}=0$, $\\lim_{x\\to0^+}=0$ y $f(0)=0$", "No, porque los límites no coinciden", "No, porque $f(0)$ no existe", "Sí, pero solo por la derecha"],
            correct: 0,
            explanation: "Límite por izquierda: $\\lim_{x\\to0^-}2x=0$. Límite por derecha: $\\lim_{x\\to0^+}x^2=0$. $f(0)=0$. Coinciden, por lo tanto es continua."
        },
        {
            q: "$f(x) = \\begin{cases} x^2 & x\\le2 \\\\ 2x+1 & x>2 \\end{cases}$ en $x=2$. ¿Es continua?",
            options: ["No, porque $\\lim_{x\\to2^-}=4$ y $\\lim_{x\\to2^+}=5$", "Sí, porque $f(2)=4$", "Sí, porque ambos límites laterales son iguales", "No, porque $f(2)$ no existe"],
            correct: 0,
            explanation: "Límite por izquierda: $\\lim_{x\\to2^-}x^2=4$. Límite por derecha: $\\lim_{x\\to2^+}(2x+1)=5$. No coinciden, hay una discontinuidad de salto."
        },
        {
            q: "$f(x) = \\begin{cases} 3x-1 & x<1 \\\\ 3 & x\\ge1 \\end{cases}$ en $x=1$. ¿Es continua?",
            options: ["No, porque $\\lim_{x\\to1^-}=2$ y $f(1)=3$", "Sí, porque $f(1)=3$", "Sí, porque los límites laterales coinciden", "No, porque $f(1)$ no existe"],
            correct: 0,
            explanation: "Límite por izquierda: $\\lim_{x\\to1^-}(3x-1)=2$. $f(1)=3$. El límite existe pero no coincide con $f(1)$, por lo tanto es discontinua removible."
        },
        {
            q: "Defina $f(x)=\\begin{cases} \\dfrac{x^2-1}{x-1} & x\\neq1 \\\\ k & x=1 \\end{cases}$. ¿Qué valor de $k$ la hace continua en $x=1$?",
            options: ["$k=2$", "$k=1$", "$k=0$", "$k=3$"],
            correct: 0,
            explanation: "Simplificando: $\\frac{x^2-1}{x-1}=x+1$ para $x\\neq1$. El límite cuando $x\\to1$ es 2. Para que sea continua, $k=2$."
        },
        {
            q: "Defina $f(x)=\\begin{cases} \\dfrac{\\sin(x)}{x} & x\\neq0 \\\\ k & x=0 \\end{cases}$. ¿Qué valor de $k$ la hace continua en $x=0$?",
            options: ["$k=1$", "$k=0$", "$k=\\infty$", "$k=\\sin(0)$"],
            correct: 0,
            explanation: "El límite fundamental $\\lim_{x\\to0}\\frac{\\sin(x)}{x}=1$. Para que sea continua en $x=0$, necesitamos que $f(0)=k=1$."
        },

        // ==================== SECCIÓN 4: Teorema del Valor Intermedio ====================
        {
            q: "Si $f(x)=x^3-2$ es continua, $f(0)=-2$ y $f(2)=6$, ¿existe $c$ tal que $f(c)=0$?",
            options: ["Sí, por el Teorema del Valor Intermedio", "No, porque 0 no está entre -2 y 6", "Sí, pero solo si $c$ es entero", "No se puede determinar"],
            correct: 0,
            explanation: "Por el TVI, como $f$ es continua en $[0,2]$ y $0$ está entre $f(0)=-2$ y $f(2)=6$, existe al menos un $c\\in(0,2)$ tal que $f(c)=0$."
        },
        {
            q: "Si $f$ es continua en $[1,4]$, $f(1)=3$ y $f(4)=12$, ¿existe $c\\in(1,4)$ tal que $f(c)=7$?",
            options: ["Sí, por el Teorema del Valor Intermedio", "No, porque 7 no está entre 3 y 12", "Sí, solo si $f$ es derivable", "No se puede determinar"],
            correct: 0,
            explanation: "El TVI garantiza que una función continua toma todos los valores intermedios. Como $3<7<12$, existe $c\\in(1,4)$ con $f(c)=7$."
        },
        {
            q: "Si $f(x)=\\cos(x)$ es continua, $f(0)=1$ y $f(\\pi)=-1$, ¿existe $c$ tal que $f(c)=0$?",
            options: ["Sí, por el Teorema del Valor Intermedio", "No, porque 0 no está entre -1 y 1", "Sí, solo si $c$ es múltiplo de $\\pi$", "No se puede determinar"],
            correct: 0,
            explanation: "Por el TVI, como $0$ está entre $f(0)=1$ y $f(\\pi)=-1$, existe $c\\in(0,\\pi)$ con $f(c)=0$ (efectivamente $c=\\pi/2$)."
        },
        {
            q: "Una función continua en $[0,10]$ con $f(0)=-5$ y $f(10)=8$. ¿Cruza el eje $x$?",
            options: ["Sí, por el Teorema del Valor Intermedio", "No, porque la función podría saltarse el 0", "Sí, solo si es derivable", "No se puede determinar"],
            correct: 0,
            explanation: "El TVI garantiza que como $0$ está entre $-5$ y $8$, la función debe cruzar el eje $x$ en algún punto del intervalo $[0,10]$."
        }
    ];

    let currentQ = 0;
    let correctCount = 0;
    let errorCount = 0;
    let studentName = "";
    let answered = false;
    const MAX_ERRORS = 10;

    // Establecer fecha de hoy por defecto
    const fechaInput = document.getElementById('fecha');
    if (fechaInput) {
        const hoy = new Date();
        const año = hoy.getFullYear();
        const mes = String(hoy.getMonth() + 1).padStart(2, '0');
        const dia = String(hoy.getDate()).padStart(2, '0');
        fechaInput.value = `${año}-${mes}-${dia}`;
    }

    function startQuiz() {
        const nameInput = document.getElementById('nombre').value.trim();
        const dateInput = document.getElementById('fecha').value;
        if(!nameInput || !dateInput) {
            alert("Por favor, ingresa tu nombre y la fecha.");
            return;
        }
        studentName = nameInput;
        document.getElementById('registro').classList.add('hidden');
        document.getElementById('actividad').classList.remove('hidden');
        loadQuestion();
    }

    function loadQuestion() {
        answered = false;
        const q = questions[currentQ];
        document.getElementById('q-text').innerHTML = `<strong>Pregunta ${currentQ + 1}:</strong><br>${q.q}`;
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        
        q.options.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = opt;
            btn.onclick = () => selectOption(i, btn);
            container.appendChild(btn);
        });
        document.getElementById('feedback').style.display = 'none';
        document.getElementById('btn-next').disabled = true;
        updateStats();
        
        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise();
        }
    }

    function selectOption(index, btn) {
        if(answered) return;
        document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        document.getElementById('btn-next').disabled = false;
        btn.dataset.index = index;
    }

    function nextQuestion() {
        if(!answered) {
            const selected = document.querySelector('.option-btn.selected');
            if(!selected) {
                alert("Por favor, selecciona una respuesta antes de continuar.");
                return;
            }
            const idx = parseInt(selected.dataset.index);
            checkAnswer(idx);
            answered = true;
            document.getElementById('btn-next').innerText = (currentQ < questions.length - 1) ? "Siguiente Pregunta" : "Finalizar";
            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise();
            }
        } else {
            currentQ++;
            if(currentQ < questions.length) {
                loadQuestion();
                document.getElementById('btn-next').innerText = "Siguiente";
            } else {
                showResults();
            }
        }
    }

    function checkAnswer(selectedIdx) {
        const q = questions[currentQ];
        const isCorrect = selectedIdx === q.correct;
        const feedback = document.getElementById('feedback');
        const btns = document.querySelectorAll('.option-btn');

        btns.forEach(b => b.classList.add('disabled'));
        btns[q.correct].classList.add('correct');

        if(isCorrect) {
            correctCount++;
            feedback.className = "feedback correct";
            feedback.innerHTML = "<strong>¡Excelente!</strong> " + q.explanation;
        } else {
            errorCount++;
            btns[selectedIdx].classList.add('incorrect');
            feedback.className = "feedback incorrect";
            feedback.innerHTML = "<strong>Incorrecto.</strong> " + q.explanation;
            
            if(errorCount >= MAX_ERRORS) {
                setTimeout(() => {
                    alert(`Has alcanzado el límite de ${MAX_ERRORS} errores. Te recomendamos repasar: las tres condiciones de continuidad, tipos de discontinuidad (removible, salto, infinita) y el Teorema del Valor Intermedio.`);
                    location.reload();
                }, 1500);
            }
        }
        feedback.style.display = 'block';
        updateStats();
    }

    function updateStats() {
        document.getElementById('correct-count').innerText = correctCount;
        document.getElementById('error-count').innerText = errorCount;
        const prog = Math.round((currentQ / questions.length) * 100);
        document.getElementById('progress-pct').innerText = prog + "%";
        document.getElementById('progress-bar').style.width = prog + "%";
    }

    function showResults() {
        document.getElementById('actividad').classList.add('hidden');
        document.getElementById('resultados').classList.remove('hidden');
        document.getElementById('student-name-display').innerText = studentName;
        const score = Math.round((correctCount / questions.length) * 100);
        document.getElementById('final-score').innerText = score + "%";
        
        let msg = score >= 80 ? 
            "¡Excelente trabajo! Dominas los conceptos de continuidad: condiciones, tipos de discontinuidad y el Teorema del Valor Intermedio." : 
            "Buen esfuerzo. Te sugerimos repasar las tres condiciones de continuidad, cómo identificar los tipos de discontinuidad (removible, salto, infinita) y el Teorema del Valor Intermedio para funciones continuas.";
        document.getElementById('personal-message').innerText = msg;
    }
</script>
</body>
</html>
