<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuestionario: Cálculo de Áreas entre Curvas (Sesión 13)</title>
    
    <!-- MathJax para renderizado dinámico de LaTeX -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root {
            --primary: #1e3a8a;
            --secondary: #3b82f6;
            --success: #10b981;
            --error: #ef4444;
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #1f2937;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }
        .quiz-container {
            background-color: var(--card);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 1000px;
            padding: 40px;
            box-sizing: border-box;
        }
        h1 { color: var(--primary); font-size: 2rem; text-align: center; margin: 0 0 10px 0; }
        h2 { font-size: 1rem; color: #6b7280; text-align: center; margin-bottom: 30px; text-transform: uppercase; }
        .register-form { display: flex; flex-direction: column; gap: 15px; max-width: 500px; margin: 30px auto; }
        .register-form input { padding: 14px; font-size: 1.1rem; border: 2px solid #e5e7eb; border-radius: 8px; outline: none; width: 100%; box-sizing: border-box; }
        .progress-container { background-color: #e5e7eb; border-radius: 10px; height: 12px; width: 100%; margin-bottom: 35px; overflow: hidden; }
        .progress-bar { background-color: var(--secondary); height: 100%; width: 0%; transition: width 0.4s ease; }
        .question { font-size: 1.35rem; font-weight: 600; margin-bottom: 25px; line-height: 1.6; }
        .options-container { display: flex; flex-direction: column; gap: 14px; }
        .option-btn { background-color: #f9fafb; border: 2px solid #e5e7eb; border-radius: 8px; padding: 18px 25px; font-size: 1.15rem; text-align: left; cursor: pointer; outline: none; }
        .option-btn:hover:not([disabled]) { background-color: #eff6ff; border-color: var(--secondary); }
        .option-btn.correct { background-color: #d1fae5; border-color: var(--success); color: #065f46; font-weight: bold; }
        .option-btn.incorrect { background-color: #fee2e2; border-color: var(--error); color: #991b1b; }
        .feedback { margin-top: 25px; font-weight: 600; font-size: 1.1rem; text-align: center; }
        .next-btn { display: block; width: 100%; max-width: 400px; background-color: var(--primary); color: white; border: none; border-radius: 8px; padding: 16px; font-size: 1.15rem; font-weight: bold; cursor: pointer; margin: 30px auto 0 auto; }
        .next-btn:disabled { background-color: #9ca3af; cursor: not-allowed; }
        .score-circle { width: 140px; height: 140px; border-radius: 50%; background-color: #eff6ff; border: 4px solid var(--secondary); display: flex; justify-content: center; align-items: center; margin: 30px auto; font-size: 2.5rem; font-weight: bold; color: var(--primary); }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="quiz-container">
    <!-- PANTALLA 1: BIENVENIDA -->
    <div id="register-screen">
        <h1>Cálculo Integral</h1>
        <p style="text-align: center; color: #4b5563; font-size: 1.1rem; max-width: 600px; margin: 0 auto; line-height: 1.6;">
            Ingresa tus datos para iniciar la evaluación práctica de la Sesión 13 <br>(Cálculo de Áreas de Regiones Planas - Parte 2: Áreas entre dos curvas).
        </p>
        <div class="register-form">
            <input type="text" id="student-name" placeholder="Escribe tu nombre aquí..." autocomplete="off">
            <button class="next-btn" id="start-button">Comenzar Cuestionario</button>
        </div>
    </div>

    <!-- PANTALLA 2: CUESTIONARIO -->
    <div id="quiz-screen" class="hidden">
        <h1>Cálculo Integral</h1>
        <h2 id="quiz-subtitle">Sesión 13: Áreas entre dos Curvas</h2>
        <div class="progress-container"><div class="progress-bar" id="progress"></div></div>
        <div class="question" id="question-text">Cargando pregunta...</div>
        <div class="options-container" id="options"></div>
        <div class="feedback" id="feedback"></div>
        <button class="next-btn" id="next-button" disabled>Siguiente Pregunta</button>
    </div>

    <!-- PANTALLA 3: RESULTADOS -->
    <div id="result-screen" class="hidden">
        <h1>¡Evaluación Completada!</h1>
        <h2 id="result-user-greeting">Resultados</h2>
        <div class="score-circle" id="score-text">0/5</div>
        <p id="evaluation-comment" style="line-height: 1.6; font-size: 1.2rem; padding: 0 20px; max-width: 700px; margin: 0 auto; text-align: center;"></p>
        <button class="next-btn" onclick="resetQuiz()">Volver a intentar</button>
    </div>
</div>

<script>
    const quizData = [
        {
            q: "Calcule el área exacta de la región encerrada por las curvas \\( y = x^2 \\) y \\( y = x \\) en el intervalo cerrado \\( \\).",
            opts: [
                { t: "\\( \\frac{1}{6} \\)", ok: true },
                { t: "\\( \\frac{1}{12} \\)", ok: false },
                { t: "\\( \\frac{1}{3} \\)", ok: false },
                { t: "\\( \\frac{5}{6} \\)", ok: false }
            ]
        },
        {
            q: "Determine el área exacta de la región encerrada por las curvas parabólicas \\( y = x^2 - 2x \\) y \\( y = 4 - x^2 \\).",
            opts: [
                { t: "\\( 9 \\)", ok: true },
                { t: "\\( 6 \\)", ok: false },
                { t: "\\( \\frac{15}{2} \\)", ok: false },
                { t: "\\( 12 \\)", ok: false }
            ]
        },
        {
            q: "Halle el área de la región acotada en el primer cuadrante entre las curvas de la función raíz \\( y = \\sqrt{x} \\) y la parábola \\( y = x^2 \\).",
            opts: [
                { t: "\\( \\frac{1}{3} \\)", ok: true },
                { t: "\\( \\frac{2}{3} \\)", ok: false },
                { t: "\\( \\frac{1}{4} \\)", ok: false },
                { t: "\\( \\frac{1}{2} \\)", ok: false }
            ]
        },
        {
            q: "Determine el área exacta de la región acotada por las funciones trigonométricas \\( y = \\sin(x) \\) y \\( y = \\cos(x) \\) desde \\( x = 0 \\) hasta \\( x = \\frac{\\pi}{2} \\).",
            opts: [
                { t: "\\( 2\\sqrt{2} - 2 \\)", ok: true },
                { t: "\\( \\sqrt{2} - 1 \\)", ok: false },
                { t: "\\( 2\\sqrt{2} \\)", ok: false },
                { t: "\\( 1 \\)", ok: false }
            ]
        },
        {
            q: "Halle el área de la región encerrada por las curvas \\( x = y^2 \\) y \\( x = y + 2 \\) integrando respecto a la variable vertical \\( y \\).",
            opts: [
                { t: "\\( \\frac{9}{2} \\)", ok: true },
                { t: "\\( \\frac{7}{2} \\)", ok: false },
                { t: "\\( 5 \\)", ok: false },
                { t: "\\( \\frac{15}{4} \\)", ok: false }
            ]
        }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let hasAnswered = false;
    let userName = "";
    let currentShuffledOptions = [];

    const registerScreen = document.getElementById("register-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const resultScreen = document.getElementById("result-screen");
    const studentNameInput = document.getElementById("student-name");
    const startButton = document.getElementById("start-button");
    const questionText = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options");
    const progressBar = document.getElementById("progress");
    const nextButton = document.getElementById("next-button");
    const feedback = document.getElementById("feedback");
    const quizSubtitle = document.getElementById("quiz-subtitle");
    const resultUserGreeting = document.getElementById("result-user-greeting");
    const scoreText = document.getElementById("score-text");
    const evaluationComment = document.getElementById("evaluation-comment");

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    startButton.addEventListener("click", () => {
        const inputName = studentNameInput.value.trim();
        if (inputName === "") {
            alert("Por favor, ingresa tu nombre completo para comenzar.");
            return;
        }
        userName = inputName;
        registerScreen.classList.add("hidden");
        quizScreen.classList.remove("hidden");
        quizSubtitle.innerHTML = `Evaluación de ${userName} <br>Sesión 13: Áreas entre dos Curvas`;
        loadQuestion();
    });

    function loadQuestion() {
        hasAnswered = false;
        nextButton.disabled = true;
        nextButton.innerText = "Siguiente Pregunta";
        feedback.innerText = "";
        
        const currentQuestion = quizData[currentQuestionIndex];
        questionText.innerHTML = `${currentQuestionIndex + 1}. ${currentQuestion.q}`;
        
        const progressPercent = (currentQuestionIndex / quizData.length) * 100;
        progressBar.style.width = `${progressPercent}%`;

        currentShuffledOptions = shuffleArray([...currentQuestion.opts]);

        optionsContainer.innerHTML = "";
        currentShuffledOptions.forEach((opt) => {
            const button = document.createElement("button");
            button.classList.add("option-btn");
            button.innerHTML = opt.t;
            button.addEventListener("click", () => selectOption(opt.ok, button));
            optionsContainer.appendChild(button);
        });

        if (window.MathJax) {
            MathJax.typesetPromise([questionText, optionsContainer]).catch((err) => console.log(err));
        }
    }

    function selectOption(isCorrect, selectedButton) {
        if (hasAnswered) return;
        hasAnswered = true;

        const buttons = optionsContainer.getElementsByClassName("option-btn");
        for (let btn of buttons) {
            btn.disabled = true;
        }

        if (isCorrect) {
            selectedButton.classList.add("correct");
            feedback.innerHTML = "¡Correcto! Modelación analítica impecable.";
            feedback.style.color = "var(--success)";
            score++;
        } else {
            selectedButton.classList.add("incorrect");
            currentShuffledOptions.forEach((opt, idx) => {
                if (opt.ok) {
                    buttons[idx].classList.add("correct");
                }
            });
            feedback.innerHTML = "Incorrecto. Identifica la función techo y piso e integra en los límites correctos.";
            feedback.style.color = "var(--error)";
        }

        if (window.MathJax) {
            MathJax.typesetPromise([feedback]).catch((err) => console.log(err));
        }

        nextButton.disabled = false;
        if (currentQuestionIndex === quizData.length - 1) {
            nextButton.innerText = "Ver Resultados";
        }
    }

    nextButton.addEventListener("click", () => {
        currentQuestionIndex++;
        if (currentQuestionIndex < quizData.length) {
            loadQuestion();
        } else {
            showResults();
        }
    });

    function showResults() {
        progressBar.style.width = "100%";
        quizScreen.classList.add("hidden");
        resultScreen.classList.remove("hidden");
        
        resultUserGreeting.innerText = `Estudiante: ${userName}`;
        scoreText.innerText = `${score}/${quizData.length}`;

        if (score === 5) {
            evaluationComment.innerHTML = `<strong>¡Absolutamente sobresaliente, ${userName}!</strong> Has dominado por completo el análisis geométrico de áreas entre curvas. Tu precisión matemática es perfecta.`;
        } else if (score >= 3) {
            evaluationComment.innerHTML = `<strong>¡Muy bien hecho, ${userName}!</strong> Tienes una gran comprensión conceptual sobre cómo definir los límites de integración mediante intersecciones de funciones. Sigue así.`;
        } else {
            evaluationComment.innerHTML = `<strong>Es momento de repasar, ${userName}.</strong> Recuerda que restar la función inferior de la superior y encontrar los puntos de cruce es vital para resolver estos problemas. ¡Te invitamos a reintentarlo!`;
        }

        if (window.MathJax) {
            MathJax.typesetPromise([evaluationComment]).catch((err) => console.log(err));
        }
    }

    function resetQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        resultScreen.classList.add("hidden");
        studentNameInput.value = "";
        registerScreen.classList.remove("hidden");
    }
</script>
</body>
</html>
