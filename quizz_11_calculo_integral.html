
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuestionario: Cálculo de Áreas Planas (Parte 1)</title>
    
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root {
            --primary: #1e3a8a;
            --secondary: #3b82f6;
            --success: #10b981;
            --error: #ef4444;
            --bg: #f3f4f6;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: #1f2937;
            margin: 0;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }
        .quiz-container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 95%;
            max-width: 1000px;
            padding: 40px;
            box-sizing: border-box;
        }
        h1 { color: var(--primary); font-size: 2rem; text-align: center; margin: 0 0 10px 0; }
        h2 { font-size: 1rem; color: #6b7280; text-align: center; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 1.5px; }
        .register-form { display: flex; flex-direction: column; gap: 15px; max-width: 500px; margin: 30px auto; }
        .register-form input { padding: 14px; font-size: 1.1rem; border: 2px solid #e5e7eb; border-radius: 8px; outline: none; }
        .register-form input:focus { border-color: var(--secondary); }
        .progress-bar-container { background-color: #e5e7eb; border-radius: 10px; height: 12px; width: 100%; margin-bottom: 35px; overflow: hidden; }
        .progress-bar { background-color: var(--secondary); height: 100%; width: 0%; transition: width 0.4s ease; }
        .question { font-size: 1.35rem; font-weight: 600; margin-bottom: 25px; line-height: 1.6; }
        .options-container { display: flex; flex-direction: column; gap: 14px; }
        .option-btn { background-color: #f9fafb; border: 2px solid #e5e7eb; border-radius: 8px; padding: 18px 25px; font-size: 1.15rem; text-align: left; cursor: pointer; transition: all 0.2s ease; outline: none; }
        .option-btn:hover:not([disabled]) { background-color: #eff6ff; border-color: var(--secondary); }
        .option-btn.correct { background-color: #d1fae5; border-color: var(--success); color: #065f46; font-weight: bold; }
        .option-btn.incorrect { background-color: #fee2e2; border-color: var(--error); color: #991b1b; }
        .feedback { margin-top: 25px; font-weight: 600; font-size: 1.1rem; text-align: center; min-height: 28px; }
        .next-btn { display: block; width: 100%; max-width: 400px; background-color: var(--primary); color: white; border: none; border-radius: 8px; padding: 16px; font-size: 1.15rem; font-weight: bold; cursor: pointer; margin: 30px auto 0 auto; transition: background-color 0.2s; }
        .next-btn:hover { background-color: #172554; }
        .next-btn:disabled { background-color: #9ca3af; cursor: not-allowed; }
        .score-circle { width: 140px; height: 140px; border-radius: 50%; background-color: #eff6ff; border: 4px solid var(--secondary); display: flex; justify-content: center; align-items: center; margin: 30px auto; font-size: 2.5rem; font-weight: bold; color: var(--primary); }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="register-screen">
        <h1>Cálculo Integral</h1>
        <p style="text-align: center; color: #4b5563; font-size: 1.1rem; max-width: 600px; margin: 0 auto; line-height: 1.6;">
            Ingresa tus datos para iniciar la evaluación práctica de la Sesión 11 <br>(Cálculo de Áreas de Regiones Planas - Parte 1).
        </p>
        <div class="register-form">
            <input type="text" id="student-name" placeholder="Escribe tu nombre aquí..." autocomplete="off">
            <button class="next-btn" id="start-button">Comenzar Cuestionario</button>
        </div>
    </div>

    <div id="quiz-screen" class="hidden">
        <h1>Cálculo Integral</h1>
        <h2 id="quiz-subtitle">Sesión 11: Cálculo de Áreas Planas (Parte 1)</h2>
        <div class="progress-bar-container"><div class="progress-bar" id="progress"></div></div>
        <div class="question" id="question-text">Cargando pregunta...</div>
        <div class="options-container" id="options"></div>
        <div class="feedback" id="feedback"></div>
        <button class="next-btn" id="next-button" disabled>Siguiente Pregunta</button>
    </div>

    <div id="result-screen" class="hidden">
        <h1>¡Evaluación Completada!</h1>
        <h2 id="result-user-greeting">Resultados</h2>
        <div class="score-circle" id="score-text">0/10</div>
        <p id="evaluation-comment" style="line-height: 1.6; font-size: 1.2rem; padding: 0 20px; max-width: 700px; margin: 0 auto; text-align: center;"></p>
        <button class="next-btn" onclick="resetQuiz()">Volver a intentar</button>
    </div>
</div>

<script>
    // q: pregunta, o: opciones, c: índice correcto
    const quizData = [
        {
            q: "Determine el área de la región plana acotada bajo la curva \\( y = x^2 \\), el eje \\( x \\) y las rectas límite \\( x = 1 \\) y \\( x = 3 \\).",
            o: ["\\( \\frac{26}{3} \\)", "\\( 8 \\)", "\\( \\frac{28}{3} \\)", "\\( 9 \\)"],
            c: 0
        },
        {
            q: "Calcule el área exacta de la región encerrada por la curva \\( y = 2x - x^2 \\) y el eje \\( x \\).",
            o: ["\\( \\frac{4}{3} \\)", "\\( \\frac{2}{3} \\)", "\\( 2 \\)", "\\( \\frac{5}{3} \\)"],
            c: 0
        },
        {
            q: "Encuentre el área de la región plana bajo la curva exponencial \\( y = e^x \\) desde \\( x = 0 \\) hasta \\( x = \\ln(2) \\).",
            o: ["\\( 1 \\)", "\\( e - 1 \\)", "\\( \\ln(2) \\)", "\\( 2 \\)"],
            c: 0
        },
        {
            q: "Determine el área de la región acotada por la curva racional \\( y = \\frac{1}{x} \\), el eje \\( x \\) y las rectas límite \\( x = 1 \\) y \\( x = e \\).",
            o: ["\\( 1 \\)", "\\( e - 1 \\)", "\\( \\ln(e) + 1 \\)", "\\( \\frac{1}{e} \\)"],
            c: 0
        },
        {
            q: "Calcule el área de la región limitada por la curva trigonométrica \\( y = \\cos(x) \\), el eje \\( x \\) y las rectas \\( x = 0 \\) y \\( x = \\frac{\\pi}{2} \\).",
            o: ["\\( 1 \\)", "\\( 0 \\)", "\\( \\frac{\\pi}{2} \\)", "\\( \\sqrt{2} \\)"],
            c: 0
        },
        {
            q: "Halle el área bajo la curva del tipo raíz \\( y = \\sqrt{x} \\), limitada por el eje \\( x \\) y la recta vertical \\( x = 4 \\).",
            o: ["\\( \\frac{16}{3} \\)", "\\( \\frac{8}{3} \\)", "\\( 4 \\)", "\\( 6 \\)"],
            c: 0
        },
        {
            q: "Determine el área de la región plana situada bajo la curva \\( y = 3x^2 + 2x + 1 \\) en el intervalo cerrado \\( \\).",
            o: ["\\( 11 \\)", "\\( 12 \\)", "\\( 14 \\)", "\\( 10 \\)"],
            c: 0
        },
        {
            q: "Calcule el área de la región plana que queda acotada completamente entre la curva polinómica \\( y = 1 - x^4 \\) y el eje \\( x \\).",
            o: ["\\( \\frac{8}{5} \\)", "\\( \\frac{4}{5} \\)", "\\( \\frac{12}{5} \\)", "\\( 2 \\)"],
            c: 0
        },
        {
            q: "Determine el área de la región acotada bajo la curva del tipo inversa trigonométrica \\( y = \\frac{1}{1+x^2} \\), el eje \\( x \\) y las rectas \\( x = 0 \\) y \\( x = 1 \\).",
            o: ["\\( \\frac{\\pi}{4} \\)", "\\( \\pi \\)", "\\( \\frac{\\pi}{2} \\)", "\\( 1 \\)"],
            c: 0
        },
        {
            q: "Encuentre el área exacta de la región acotada por la curva trigonométrica \\( y = \\operatorname{sen}(x) \\) y el eje \\( x \\) en el intervalo \\( [0, \\pi] \\).",
            o: ["\\( 2 \\)", "\\( 1 \\)", "\\( 0 \\)", "\\( \\pi \\)"],
            c: 0
        }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let hasAnswered = false;
    let userName = "";
    let currentShuffledOptions = [];

    const registerScreen = document.getElementById("register-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const resultScreen = document.getElementById("result-screen");
    const studentNameInput = document.getElementById("student-name");
    const startButton = document.getElementById("start-button");
    const questionText = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options");
    const progressBar = document.getElementById("progress");
    const nextButton = document.getElementById("next-button");
    const feedback = document.getElementById("feedback");
    const quizSubtitle = document.getElementById("quiz-subtitle");
    const resultUserGreeting = document.getElementById("result-user-greeting");
    const scoreText = document.getElementById("score-text");
    const evaluationComment = document.getElementById("evaluation-comment");

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    startButton.addEventListener("click", () => {
        const inputName = studentNameInput.value.trim();
        if (inputName === "") {
            alert("Por favor, ingresa tu nombre completo para comenzar.");
            return;
        }
        userName = inputName;
        registerScreen.classList.add("hidden");
        quizScreen.classList.remove("hidden");
        quizSubtitle.innerHTML = `Evaluación de ${userName} <br>Sesión 11: Cálculo de Áreas Planas`;
        loadQuestion();
    });

    function loadQuestion() {
        hasAnswered = false;
        nextButton.disabled = true;
        nextButton.innerText = "Siguiente Pregunta";
        feedback.innerText = "";
        
        const currentQuestion = quizData[currentQuestionIndex];
        questionText.innerHTML = `${currentQuestionIndex + 1}. ${currentQuestion.q}`;
        
        const progressPercent = (currentQuestionIndex / quizData.length) * 100;
        progressBar.style.width = `${progressPercent}%`;

        const mappedOptions = currentQuestion.o.map((option, idx) => ({
            text: option,
            isCorrect: idx === currentQuestion.c
        }));

        currentShuffledOptions = shuffleArray([...mappedOptions]);

        optionsContainer.innerHTML = "";
        currentShuffledOptions.forEach((opt) => {
            const button = document.createElement("button");
            button.classList.add("option-btn");
            button.innerHTML = opt.text;
            button.addEventListener("click", () => selectOption(opt.isCorrect, button));
            optionsContainer.appendChild(button);
        });

        if (window.MathJax) {
            MathJax.typesetPromise([questionText, optionsContainer]).catch((err) => console.log(err));
        }
    }

    function selectOption(isCorrect, selectedButton) {
        if (hasAnswered) return;
        hasAnswered = true;

        const buttons = optionsContainer.getElementsByClassName("option-btn");
        for (let btn of buttons) {
            btn.disabled = true;
        }

        if (isCorrect) {
            selectedButton.classList.add("correct");
            feedback.innerHTML = "¡Correcto! Integración y límites evaluados perfectamente.";
            feedback.style.color = "var(--success)";
            score++;
        } else {
            selectedButton.classList.add("incorrect");
            currentShuffledOptions.forEach((opt, idx) => {
                if (opt.isCorrect) {
                    buttons[idx].classList.add("correct");
                }
            });
            feedback.innerHTML = "Incorrecto. Repasa la sustitución de límites mediante el Teorema Fundamental.";
            feedback.style.color = "var(--error)";
        }

        if (window.MathJax) {
            MathJax.typesetPromise([feedback]).catch((err) => console.log(err));
        }

        nextButton.disabled = false;
        if (currentQuestionIndex === quizData.length - 1) {
            nextButton.innerText = "Ver Resultados";
        }
    }

    nextButton.addEventListener("click", () => {
        currentQuestionIndex++;
        if (currentQuestionIndex < quizData.length) {
            loadQuestion();
        } else {
            showResults();
        }
    });

    function showResults() {
        progressBar.style.width = "100%";
        quizScreen.classList.add("hidden");
        resultScreen.classList.remove("hidden");
        
        resultUserGreeting.innerText = `Estudiante: ${userName}`;
        scoreText.innerText = `${score}/${quizData.length}`;

        if (score === 10) {
            evaluationComment.innerHTML = `<strong>¡Excelente, ${userName}!</strong> Has demostrado un dominio extraordinario evaluando límites de integración y calculando áreas bajo curvas con precisión exacta.`;
        } else if (score >= 7) {
            evaluationComment.innerHTML = `<strong>¡Buen trabajo, ${userName}!</strong> Comprendes con solidez el concepto de integral definida como área geométrica. Solo ten cuidado con los detalles aritméticos finos.`;
        } else {
            evaluationComment.innerHTML = `<strong>Es momento de repasar, ${userName}.</strong> Recuerda que restar el límite inferior de forma correcta es clave en el Teorema Fundamental. Te sugerimos revisar tus ejercicios y volver a intentar.`;
        }

        if (window.MathJax) {
            MathJax.typesetPromise([evaluationComment]).catch((err) => console.log(err));
        }
    }

    function resetQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        resultScreen.classList.add("hidden");
        studentNameInput.value = "";
        registerScreen.classList.remove("hidden");
    }
</script>
</body>
</html>
