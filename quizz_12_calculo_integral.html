<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuestionario: Estrategias de Integración y Áreas</title>
    
    <!-- Cargamos MathJax para renderizar código LaTeX de forma dinámica -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root {
            --primary-color: #1e3a8a;
            --secondary-color: #3b82f6;
            --success-color: #10b981;
            --error-color: #ef4444;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }

        .quiz-container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 95%;
            max-width: 1000px; /* Ancho expandido para lectura óptima de fórmulas */
            padding: 40px;
            margin: auto;
            box-sizing: border-box;
        }

        h1 {
            color: var(--primary-color);
            font-size: 2rem;
            text-align: center;
            margin-top: 0;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        h2 {
            font-size: 1rem;
            color: #6b7280;
            text-align: center;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        /* Formulario de registro */
        .register-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 500px;
            margin: 30px auto 0 auto;
        }

        .register-form label {
            font-weight: 600;
            font-size: 1.05rem;
            color: var(--text-color);
        }

        .register-form input {
            padding: 14px;
            font-size: 1.1rem;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
            width: 100%;
            box-sizing: border-box;
        }

        .register-form input:focus {
            border-color: var(--secondary-color);
        }

        .progress-bar-container {
            background-color: #e5e7eb;
            border-radius: 10px;
            height: 12px;
            width: 100%;
            margin-bottom: 35px;
            overflow: hidden;
        }

        .progress-bar {
            background-color: var(--secondary-color);
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
        }

        .question {
            font-size: 1.35rem;
            font-weight: 600;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .option-btn {
            background-color: #f9fafb;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            padding: 18px 25px;
            font-size: 1.15rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
            line-height: 1.5;
        }

        .option-btn:hover:not([disabled]) {
            background-color: #eff6ff;
            border-color: var(--secondary-color);
        }

        .option-btn.correct {
            background-color: #d1fae5;
            border-color: var(--success-color);
            color: #065f46;
            font-weight: bold;
        }

        .option-btn.incorrect {
            background-color: #fee2e2;
            border-color: var(--error-color);
            color: #991b1b;
        }

        .feedback {
            margin-top: 25px;
            font-weight: 600;
            font-size: 1.1rem;
            text-align: center;
            min-height: 28px;
        }

        .next-btn {
            display: block;
            width: 100%;
            max-width: 400px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 16px;
            font-size: 1.15rem;
            font-weight: bold;
            cursor: pointer;
            margin: 30px auto 0 auto;
            transition: background-color 0.2s;
        }

        .next-btn:hover {
            background-color: #172554;
        }

        .next-btn:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }

        .result-container {
            text-align: center;
            padding: 20px 0;
        }

        .score-circle {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background-color: #eff6ff;
            border: 4px solid var(--secondary-color);
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 30px auto;
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <!-- PANTALLA 1: BIENVENIDA -->
    <div id="register-screen">
        <h1>Cálculo Integral</h1>
        <p style="text-align: center; color: #4b5563; font-size: 1.1rem; max-width: 600px; margin: 0 auto; line-height: 1.6;">
            Ingresa tus datos para iniciar la evaluación de la Sesión 12 <br>(Taller de Integración y Áreas: Selección de Estrategias).
        </p>
        
        <div class="register-form">
            <label for="student-name">Nombre Completo:</label>
            <input type="text" id="student-name" placeholder="Escribe tu nombre aquí..." autocomplete="off">
            <button class="next-btn" id="start-button">Comenzar Cuestionario</button>
        </div>
    </div>

    <!-- PANTALLA 2: CUESTIONARIO -->
    <div id="quiz-screen" class="hidden">
        <h1>Cálculo Integral</h1>
        <h2 id="quiz-subtitle">Sesión 12: <br>Selección de Estrategias y Áreas</h2>
        
        <div class="progress-bar-container">
            <div class="progress-bar" id="progress"></div>
        </div>

        <div class="question" id="question-text">Cargando pregunta...</div>
        
        <div class="options-container" id="options">
            <!-- Botones dinámicos -->
        </div>

        <div class="feedback" id="feedback"></div>
        
        <button class="next-btn" id="next-button" disabled>Siguiente Pregunta</button>
    </div>

    <!-- PANTALLA 3: RESULTADOS -->
    <div id="result-screen" class="hidden">
        <h1>¡Evaluación Completada!</h1>
        <h2 id="result-user-greeting">Resultados</h2>
        <div class="score-circle" id="score-text">0/10</div>
        <p id="evaluation-comment" style="line-height: 1.6; font-size: 1.2rem; padding: 0 20px; max-width: 700px; margin: 0 auto;"></p>
        <button class="next-btn" onclick="resetQuiz()">Volver a intentar</button>
    </div>
</div>

<script>
    const quizData = [
        {
            question: "¿Cuál es la estrategia algebraica más directa para resolver la integral indefinida: $$\\int \\frac{x^2 - 1}{x} \\, dx$$",
            options: [
                { text: "Dividir el integrando término a término y aplicar linealidad con integrales elementales.", isCorrect: true },
                { text: "Utilizar el cambio de variable \\( u = x^2 - 1 \\).", isCorrect: false },
                { text: "Utilizar la sustitución trigonométrica de la forma \\( x = \\sec(\\theta) \\).", isCorrect: false },
                { text: "Completar el trinomio cuadrado perfecto en el numerador.", isCorrect: false }
            ]
        },
        {
            question: "Para resolver la integral por sustitución $$\\int x^2 (x^3 + 5)^9 \\, dx$$ ¿cuál es la variable auxiliar \\( u \\) adecuada?",
            options: [
                { text: "\\( u = x^3 + 5 \\)", isCorrect: true },
                { text: "\\( u = x^2 \\)", isCorrect: false },
                { text: "\\( u = (x^3 + 5)^9 \\)", isCorrect: false },
                { text: "\\( u = x^3 \\)", isCorrect: false }
            ]
        },
        {
            question: "Al aplicar la regla de sustitución en la integral $$\\int \\frac{e^x}{e^x + 3} \\, dx$$ mediante \\( u = e^x + 3 \\), ¿cuál es la estructura de la integral resultante en términos de \\( u \\)?",
            options: [
                { text: "\\( \\int \\frac{1}{u} \\, du \\)", isCorrect: true },
                { text: "\\( \\int u \\, du \\)", isCorrect: false },
                { text: "\\( \\int \\frac{e^u}{u} \\, du \\)", isCorrect: false },
                { text: "\\( \\int u e^u \\, du \\)", isCorrect: false }
            ]
        },
        {
            question: "Determine el área exacta de la región plana acotada por la curva \\( y = 3x^2 \\), el eje \\( x \\), y las rectas \\( x = 0 \\) y \\( x = 2 \\) aplicando el Teorema Fundamental del Cálculo.",
            options: [
                { text: "\\( 8 \\)", isCorrect: true },
                { text: "\\( 4 \\)", isCorrect: false },
                { text: "\\( 12 \\)", isCorrect: false },
                { text: "\\( 6 \\)", isCorrect: false }
            ]
        },
        {
            question: "Para la integral indefinida de tipo racional $$\\int \\frac{1}{x^2 + 4x + 13} \\, dx$$ ¿cuál es el paso de modelación algebraico indispensable para aplicar una fórmula inmediata?",
            options: [
                { text: "Completar el trinomio cuadrado perfecto en el denominador para obtener \\( (x+2)^2 + 9 \\) y usar \\( \\arctan \\).", isCorrect: true },
                { text: "Efectuar la sustitución directa \\( u = x^2 + 4x + 13 \\).", isCorrect: false },
                { text: "Dividir el numerador y el denominador entre \\( x^2 \\).", isCorrect: false },
                { text: "Factorizar por término común \\( x \\) en el denominador.", isCorrect: false }
            ]
        },
        {
            question: "Calcule el valor de la siguiente integral definida (para \\( x > 0 \\)) mediante sustitución logarítmica: $$\\int_{1}^{e} \\frac{\\ln(x)}{x} \\, dx$$",
            options: [
                { text: "\\( \\frac{1}{2} \\)", isCorrect: true },
                { text: "\\( 1 \\)", isCorrect: false },
                { text: "\\( e \\)", isCorrect: false },
                { text: "\\( \\ln(2) \\)", isCorrect: false }
            ]
        },
        {
            question: "Si se desea calcular el área exacta bajo la curva trigonométrica \\( y = \\cos(x) \\) en el primer cuadrante \\( [0, \\pi/2] \\), ¿cuál es la formulación matemática de la integral definida?",
            options: [
                { text: "\\( \\int_{0}^{\\pi/2} \\cos(x) \\, dx \\)", isCorrect: true },
                { text: "\\( \\int_{0}^{\\pi/2} -\\sin(x) \\, dx \\)", isCorrect: false },
                { text: "\\( \\int_{-\\pi/2}^{\\pi/2} \\cos(x) \\, dx \\)", isCorrect: false },
                { text: "\\( \\int_{0}^{\\pi} \\cos(x) \\, dx \\)", isCorrect: false }
            ]
        },
        {
            question: "Para resolver la integral indefinida de tipo compuesta $$\\int \\frac{\\sec^2(x)}{\\tan(x) + 2} \\, dx$$ ¿cuál de los siguientes enunciados describe el método correcto?",
            options: [
                { text: "Elegir \\( u = \\tan(x) + 2 \\) de modo que \\( du = \sec^2(x)dx \\), resultando en una forma logarítmica.", isCorrect: true },
                { text: "Aplicar el método de integración por partes.", isCorrect: false },
                { text: "Utilizar identidades trigonométricas para convertir a senos y cosenos.", isCorrect: false },
                { text: "Integrar por linealidad directa el numerador y el denominador.", isCorrect: false }
            ]
        },
        {
            question: "Determine la antiderivada general completando el diferencial donde sea necesario para: $$\\int \\left( \\frac{1}{\\sqrt{1-x^2}} + e^{2x} \\right) \\, dx$$",
            options: [
                { text: "\\( \\arcsen(x) + \\frac{1}{2}e^{2x} + C \\)", isCorrect: true },
                { text: "\\( \\arcsen(x) + e^{2x} + C \\)", isCorrect: false },
                { text: "\\( \\arctan(x) + 2e^{2x} + C \\)", isCorrect: false },
                { text: "\\( \\ln|1-x^2| + \\frac{1}{2}e^{2x} + C \\)", isCorrect: false }
            ]
        },
        {
            question: "Un flujo de salida de agua de un tanque de almacenamiento se modela según la función \\( f(t) = 10 e^{-0.5t} \\). ¿Qué integral definida representa la cantidad de agua drenada en el intervalo \\( [1] \\)?",
            options: [
                { text: "\\( \\int_{0}^{2} 10 e^{-0.5t} \\, dt = 20(1 - e^{-1}) \\)", isCorrect: true },
                { text: "\\( \\int_{0}^{2} 10 e^{-0.5t} \\, dt = 10(1 - e^{-1}) \\)", isCorrect: false },
                { text: "\\( \\int_{0}^{2} 10 e^{-0.5t} \\, dt = 5(1 - e^{-2}) \\)", isCorrect: false },
                { text: "\\( \\int_{0}^{2} 10 e^{-0.5t} \\, dt = 20(e^{-1} - 1) \\)", isCorrect: false }
            ]
        }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let hasAnswered = false;
    let userName = "";
    let currentShuffledOptions = [];

    // Elementos de Interfaz
    const registerScreen = document.getElementById("register-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const resultScreen = document.getElementById("result-screen");
    const studentNameInput = document.getElementById("student-name");
    const startButton = document.getElementById("start-button");
    const questionText = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options");
    const progressBar = document.getElementById("progress");
    const nextButton = document.getElementById("next-button");
    const feedback = document.getElementById("feedback");
    const quizSubtitle = document.getElementById("quiz-subtitle");
    const resultUserGreeting = document.getElementById("result-user-greeting");
    const scoreText = document.getElementById("score-text");
    const evaluationComment = document.getElementById("evaluation-comment");

    // Algoritmo Fisher-Yates para barajar opciones
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    startButton.addEventListener("click", () => {
        const inputName = studentNameInput.value.trim();
        if (inputName === "") {
            alert("Por favor, ingresa tu nombre completo para comenzar.");
            return;
        }
        userName = inputName;
        
        registerScreen.classList.add("hidden");
        quizScreen.classList.remove("hidden");
        
        quizSubtitle.innerHTML = `Evaluación de ${userName} <br>Sesión 12: Selección de Estrategias y Áreas`;
        
        loadQuestion();
    });

    function loadQuestion() {
        hasAnswered = false;
        nextButton.disabled = true;
        nextButton.innerText = "Siguiente Pregunta";
        feedback.innerText = "";
        
        const currentQuestion = quizData[currentQuestionIndex];
        questionText.innerHTML = `${currentQuestionIndex + 1}. ${currentQuestion.question}`;
        
        // Actualizar barra de progreso
        const progressPercent = (currentQuestionIndex / quizData.length) * 100;
        progressBar.style.width = `${progressPercent}%`;

        // Barajado de opciones estructuradas
        currentShuffledOptions = shuffleArray([...currentQuestion.options]);

        optionsContainer.innerHTML = "";
        currentShuffledOptions.forEach((opt, index) => {
            const button = document.createElement("button");
            button.classList.add("option-btn");
            button.innerHTML = opt.text;
            button.addEventListener("click", () => selectOption(opt.isCorrect, button));
            optionsContainer.appendChild(button);
        });

        // Forzar a MathJax a procesar y renderizar las nuevas fórmulas LaTeX en la pantalla
        if (window.MathJax) {
            MathJax.typesetPromise([questionText, optionsContainer]).catch((err) => console.log(err));
        }
    }

    function selectOption(isCorrect, selectedButton) {
        if (hasAnswered) return;
        hasAnswered = true;

        const buttons = optionsContainer.getElementsByClassName("option-btn");

        for (let btn of buttons) {
            btn.disabled = true;
        }

        if (isCorrect) {
            selectedButton.classList.add("correct");
            feedback.innerHTML = "¡Correcto! Selección estratégica y conceptual impecable.";
            feedback.style.color = "var(--success-color)";
            score++;
        } else {
            selectedButton.classList.add("incorrect");
            // Mostrar la correcta iluminándola en verde
            currentShuffledOptions.forEach((opt, idx) => {
                if (opt.isCorrect) {
                    buttons[idx].classList.add("correct");
                }
            });
            feedback.innerHTML = "Incorrecto. Analiza la estructura analítica del integrando y define tu estrategia.";
            feedback.style.color = "var(--error-color)";
        }

        // Forzar renderizado de LaTeX en el feedback
        if (window.MathJax) {
            MathJax.typesetPromise([feedback]).catch((err) => console.log(err));
        }

        nextButton.disabled = false;
        if (currentQuestionIndex === quizData.length - 1) {
            nextButton.innerText = "Ver Resultados";
        }
    }

    nextButton.addEventListener("click", () => {
        currentQuestionIndex++;
        if (currentQuestionIndex < quizData.length) {
            loadQuestion();
        } else {
            showResults();
        }
    });

    function showResults() {
        progressBar.style.width = "100%";
        quizScreen.classList.add("hidden");
        resultScreen.classList.remove("hidden");
        
        resultUserGreeting.innerText = `Estudiante: ${userName}`;
        scoreText.innerText = `${score}/${quizData.length}`;

        // Retroalimentación dirigida por nombre
        if (score === 10) {
            evaluationComment.innerHTML = `<strong>¡Absolutamente brillante, ${userName}!</strong> Tu capacidad de análisis para seleccionar de forma rápida e intuitiva el cambio de variable, la descomposición o el teorema adecuado es sobresaliente. Has dominado el taller estratégico del Bloque de Áreas y Técnicas.`;
        } else if (score >= 7) {
            evaluationComment.innerHTML = `<strong>¡Muy bien hecho, ${userName}!</strong> Demuestras un criterio sólido para identificar integrales inmediatas y por cambio de variable, así como la modelación matemática de áreas planas. Sigue puliendo tu velocidad analítica.`;
        } else {
            evaluationComment.innerHTML = `<strong>Es momento de repasar, ${userName}.</strong> El taller de selección de estrategias sirve precisamente para entrenar el ojo matemático y clasificar un problema antes de operar de forma mecánica. Te sugerimos revisar las tablas del libro de James Stewart y volver a intentar.`;
        }

        if (window.MathJax) {
            MathJax.typesetPromise([evaluationComment]).catch((err) => console.log(err));
        }
    }

    function resetQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        resultScreen.classList.add("hidden");
        studentNameInput.value = "";
        registerScreen.classList.remove("hidden");
    }
</script>
</body>
</html>
