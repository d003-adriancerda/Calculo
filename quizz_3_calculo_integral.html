<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuestionario: Análisis de Funciones y Optimización (Sesión 3)</title>
    <style>
        :root {
            --primary-color: #1e3a8a;
            --secondary-color: #3b82f6;
            --success-color: #10b981;
            --error-color: #ef4444;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }

        .quiz-container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            padding: 30px;
            margin: auto;
            box-sizing: border-box;
        }

        h1 {
            color: var(--primary-color);
            font-size: 1.6rem;
            text-align: center;
            margin-top: 0;
            margin-bottom: 5px;
        }

        h2 {
            font-size: 0.9rem;
            color: #6b7280;
            text-align: center;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Formulario de registro */
        .register-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        .register-form label {
            font-weight: 600;
            font-size: 1rem;
            color: var(--text-color);
        }

        .register-form input {
            padding: 12px;
            font-size: 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }

        .register-form input:focus {
            border-color: var(--secondary-color);
        }

        .progress-bar-container {
            background-color: #e5e7eb;
            border-radius: 10px;
            height: 10px;
            width: 100%;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-bar {
            background-color: var(--secondary-color);
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
        }

        .question {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: #f9fafb;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            padding: 15px;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        .option-btn:hover:not([disabled]) {
            background-color: #eff6ff;
            border-color: var(--secondary-color);
        }

        .option-btn.correct {
            background-color: #d1fae5;
            border-color: var(--success-color);
            color: #065f46;
            font-weight: bold;
        }

        .option-btn.incorrect {
            background-color: #fee2e2;
            border-color: var(--error-color);
            color: #991b1b;
        }

        .feedback {
            margin-top: 20px;
            font-weight: 600;
            text-align: center;
            min-height: 24px;
        }

        .next-btn {
            display: block;
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 25px;
            transition: background-color 0.2s;
        }

        .next-btn:hover {
            background-color: #172554;
        }

        .next-btn:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }

        .result-container {
            text-align: center;
        }

        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: #eff6ff;
            border: 4px solid var(--secondary-color);
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px auto;
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <!-- PANTALLA 1: REGISTRO -->
    <div id="register-screen">
        <h1>Cálculo Integral</h1>
        <p style="text-align: center; color: #4b5563;">Ingresa tus datos para iniciar la evaluación práctica de la Sesión 3 <br> (Análisis de Funciones y Optimización).</p>
        
        <div class="register-form">
            <label for="student-name">Nombre Completo:</label>
            <input type="text" id="student-name" placeholder="Ej. Juan Pérez" autocomplete="off">
            <button class="next-btn" id="start-button" style="margin-top: 10px;">Comenzar Cuestionario</button>
        </div>
    </div>

    <!-- PANTALLA 2: CUESTIONARIO -->
    <div id="quiz-screen" class="hidden">
        <h1>Cálculo Integral</h1>
        <h2 id="quiz-subtitle">Sesión 3: Extremos y Optimización</h2>
        
        <div class="progress-bar-container">
            <div class="progress-bar" id="progress"></div>
        </div>

        <div class="question" id="question-text">Cargando pregunta...</div>
        
        <div class="options-container" id="options">
            <!-- Botones de opciones dinámicas -->
        </div>

        <div class="feedback" id="feedback"></div>
        
        <button class="next-btn" id="next-button" disabled>Siguiente Pregunta</button>
    </div>

    <!-- PANTALLA 3: RESULTADOS -->
    <div id="result-screen" class="hidden">
        <h1>¡Cuestionario Completado!</h1>
        <h2 id="result-user-greeting">Resultados</h2>
        <div class="score-circle" id="score-text">0/10</div>
        <p id="evaluation-comment" style="line-height: 1.5; font-size: 1.1rem; padding: 0 10px;"></p>
        <button class="next-btn" onclick="resetQuiz()">Volver a intentar</button>
    </div>
</div>

<script>
    const quizData = [
        {
            question: "Encuentre los números (puntos) críticos de la función f(x) = x³ - 3x² - 9x + 5.",
            options: [
                "x = 3  y  x = -1",
                "x = 1  y  x = -3",
                "x = 0  y  x = 3",
                "x = 1  y  x = 9"
            ],
            correct: 0
        },
        {
            question: "¿En qué intervalo la función f(x) = x³ - 3x es estrictamente creciente?",
            options: [
                "(-1, 1)",
                "(-∞, -1) ∪ (1, ∞)",
                "(-∞, 0)",
                "(0, ∞)"
            ],
            correct: 1
        },
        {
            question: "Determine en qué valor de x la función f(x) = x³ - 3x alcanza su valor máximo local.",
            options: [
                "x = 1",
                "x = -1",
                "x = 0",
                "x = 2"
            ],
            correct: 1
        },
        {
            question: "Calcule las coordenadas del punto de inflexión de la curva f(x) = x³ - 6x² + 12x.",
            options: [
                "(2, 8)",
                "(0, 0)",
                "(1, 7)",
                "(2, 4)"
            ],
            correct: 0
        },
        {
            question: "Determine el intervalo en el cual la función f(x) = 2x³ - 12x² + 5 es cóncava hacia arriba.",
            options: [
                "(-∞, 2)",
                "(2, ∞)",
                "(0, ∞)",
                "(-∞, 0)"
            ],
            correct: 1
        },
        {
            question: "Se desea construir una caja con base cuadrada y sin tapa utilizando exactamente 1200 cm² de cartón. ¿Cuál debe ser la longitud del lado de la base (en cm) para que el volumen de la caja sea máximo?",
            options: [
                "10 cm",
                "20 cm",
                "15 cm",
                "30 cm"
            ],
            correct: 1
        },
        {
            question: "Determine el valor mínimo absoluto de la función cuadrática f(x) = x² - 4x + 5 en el intervalo cerrado.",
            options: [
                "1",
                "5",
                "2",
                "0"
            ],
            correct: 0
        },
        {
            question: "Para la función f(x) = 4x - x⁴, se sabe que x = 1 es un punto crítico. Evalúe la segunda derivada f''(1) para clasificarlo.",
            options: [
                "f''(1) = -12, lo que indica un máximo local.",
                "f''(1) = -12, lo que indica un mínimo local.",
                "f''(1) = 12, lo que indica un máximo local.",
                "f''(1) = 0, lo que indica un punto de inflexión."
            ],
            correct: 0
        },
        {
            question: "Encuentre dos números reales positivos cuya suma sea exactamente 30 y cuyo producto sea el máximo posible.",
            options: [
                "10 y 20",
                "15 y 15",
                "5 y 25",
                "12 y 18"
            ],
            correct: 1
        },
        {
            question: "Halle la pendiente de la recta tangente a la curva f(x) = x³ - 3x² + 4 en su propio punto de inflexión.",
            options: [
                "-3",
                "0",
                "3",
                "-6"
            ],
            correct: 0
        }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let hasAnswered = false;
    let userName = "";

    // Elementos de Pantallas
    const registerScreen = document.getElementById("register-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const resultScreen = document.getElementById("result-screen");

    // Elementos de Registro
    const studentNameInput = document.getElementById("student-name");
    const startButton = document.getElementById("start-button");

    // Elementos de Juego
    const questionText = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options");
    const progressBar = document.getElementById("progress");
    const nextButton = document.getElementById("next-button");
    const feedback = document.getElementById("feedback");
    const quizSubtitle = document.getElementById("quiz-subtitle");

    // Elementos de Resultado
    const resultUserGreeting = document.getElementById("result-user-greeting");
    const scoreText = document.getElementById("score-text");
    const evaluationComment = document.getElementById("evaluation-comment");

    // EVENTO 1: Iniciar cuestionario tras validación de nombre
    startButton.addEventListener("click", () => {
        const inputName = studentNameInput.value.trim();
        if (inputName === "") {
            alert("Por favor, ingresa tu nombre completo para comenzar.");
            return;
        }
        userName = inputName;
        
        // Transición de pantalla
        registerScreen.classList.add("hidden");
        quizScreen.classList.remove("hidden");
        
        // Personalizar subtítulo del cuestionario
        quizSubtitle.innerText = `Evaluación de ${userName}`;
        
        loadQuestion();
    });

    function loadQuestion() {
        hasAnswered = false;
        nextButton.disabled = true;
        nextButton.innerText = "Siguiente Pregunta";
        feedback.innerText = "";
        
        const currentQuestion = quizData[currentQuestionIndex];
        questionText.innerText = `${currentQuestionIndex + 1}. ${currentQuestion.question}`;
        
        // Actualizar barra de progreso
        const progressPercent = (currentQuestionIndex / quizData.length) * 100;
        progressBar.style.width = `${progressPercent}%`;

        optionsContainer.innerHTML = "";
        currentQuestion.options.forEach((option, index) => {
            const button = document.createElement("button");
            button.classList.add("option-btn");
            button.innerText = option;
            button.addEventListener("click", () => selectOption(index, button));
            optionsContainer.appendChild(button);
        });
    }

    function selectOption(selectedIndex, selectedButton) {
        if (hasAnswered) return;
        hasAnswered = true;

        const currentQuestion = quizData[currentQuestionIndex];
        const buttons = optionsContainer.getElementsByClassName("option-btn");

        for (let btn of buttons) {
            btn.disabled = true;
        }

        if (selectedIndex === currentQuestion.correct) {
            selectedButton.classList.add("correct");
            feedback.innerText = "¡Correcto! Procedimiento analítico impecable.";
            feedback.style.color = "var(--success-color)";
            score++;
        } else {
            selectedButton.classList.add("incorrect");
            buttons[currentQuestion.correct].classList.add("correct");
            feedback.innerText = "Incorrecto. Verifica los puntos críticos y la derivada.";
            feedback.style.color = "var(--error-color)";
        }

        nextButton.disabled = false;
        if (currentQuestionIndex === quizData.length - 1) {
            nextButton.innerText = "Ver Resultados";
        }
    }

    nextButton.addEventListener("click", () => {
        currentQuestionIndex++;
        if (currentQuestionIndex < quizData.length) {
            loadQuestion();
        } else {
            showResults();
        }
    });

    // EVENTO 2: Mostrar resultados con retroalimentación personalizada
    function showResults() {
        progressBar.style.width = "100%";
        quizScreen.classList.add("hidden");
        resultScreen.classList.remove("hidden");
        
        resultUserGreeting.innerText = `Estudiante: ${userName}`;
        scoreText.innerText = `${score}/${quizData.length}`;

        // Lógica de retroalimentación dirigida por nombre
        if (score === 10) {
            evaluationComment.innerHTML = `<strong>¡Excelente, ${userName}!</strong> Tu capacidad para analizar puntos de inflexión, concavidades y modelar problemas de optimización con restricciones es del más alto nivel matemático. ¡Sigue adelante!`;
        } else if (score >= 7) {
            evaluationComment.innerHTML = `<strong>¡Buen trabajo, ${userName}!</strong> Comprendes perfectamente cómo se aplican los criterios de la primera y segunda derivada para clasificar extremos locales. Continúa puliendo los detalles algebraicos en los modelos de optimización.`;
        } else {
            evaluationComment.innerHTML = `<strong>Ánimo, ${userName}.</strong> El análisis de funciones es la base del comportamiento de modelos en ingeniería. Te sugerimos repasar la Session 3 de tu planeación académica y volver a intentarlo para afianzar tus habilidades.`;
        }
    }

    function resetQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        resultScreen.classList.add("hidden");
        studentNameInput.value = "";
        registerScreen.classList.remove("hidden");
    }
</script>
</body>
</html>
