<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad de Reforzamiento: Regla de la Cadena</title>
    
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #e67e22;
            --success: #27ae60;
            --danger: #e74c3c;
            --gray: #95a5a6;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f4f7f6; color: #333; line-height: 1.6; padding: 20px; }
        .container { max-width: 850px; margin: 0 auto; background: #fff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; }
        header { background: var(--primary); color: #fff; padding: 25px; text-align: center; }
        header h1 { font-size: 1.8rem; margin-bottom: 5px; }
        header h2 { font-size: 1.1rem; font-weight: 400; opacity: 0.9; }
        section { padding: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; }
        input[type="text"], input[type="date"] { width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 6px; font-size: 1rem; margin-bottom: 10px; box-sizing: border-box; }
        .btn { display: inline-block; background: var(--secondary); color: #fff; padding: 12px 25px; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; font-weight: 600; transition: background 0.3s; width: 100%; margin-top: 10px; }
        .btn:hover { background: #d35400; }
        .btn:disabled { background: var(--gray); cursor: not-allowed; }
        .btn-next { background: var(--primary); }
        .btn-next:hover { background: #1a252f; }
        
        .stats-bar { display: flex; justify-content: space-between; background: #f8f9fa; padding: 10px 15px; border-radius: 8px; margin-bottom: 20px; font-weight: 600; flex-wrap: wrap; gap: 10px; }
        .stat-item span { color: var(--secondary); }
        .progress-container { height: 8px; background: #e0e0e0; border-radius: 4px; margin: 15px 0; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--success); width: 0%; transition: width 0.4s ease; }
        
        .question-box { margin-bottom: 20px; }
        .question-text { font-size: 1.2rem; margin-bottom: 20px; font-weight: 500; background: #fdfefe; padding: 15px; border-radius: 8px; border-left: 5px solid var(--secondary); }
        .options { display: grid; gap: 10px; }
        .option-btn { padding: 12px; background: #fff; border: 2px solid #ddd; border-radius: 8px; cursor: pointer; text-align: left; transition: all 0.2s; font-size: 1.1rem; width: 100%; }
        .option-btn:hover:not(.disabled) { border-color: var(--secondary); background: #fef5e7; }
        .option-btn.selected { border-color: var(--secondary); background: #fdebd0; font-weight: 600; }
        .option-btn.correct { border-color: var(--success); background: #d5f5e3; }
        .option-btn.incorrect { border-color: var(--danger); background: #fadbd8; }
        .option-btn.disabled { pointer-events: none; opacity: 0.7; }
        
        .feedback { margin-top: 15px; padding: 12px; border-radius: 6px; display: none; }
        .feedback.correct { background: #d5f5e3; color: #145a32; border: 1px solid #27ae60; }
        .feedback.incorrect { background: #fadbd8; color: #7b241c; border: 1px solid #e74c3c; }
        
        .results-box { text-align: center; }
        .score-circle { width: 120px; height: 120px; background: var(--secondary); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: 700; margin: 20px auto; }
        .hidden { display: none !important; }
        
        @media (max-width: 600px) {
            body { padding: 10px; }
            section { padding: 15px; }
            .option-btn { font-size: 1rem; padding: 10px; }
            .stats-bar { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Actividad de Reforzamiento</h1>
        <h2>Cálculo Diferencial | Regla de la Cadena</h2>
    </header>

    <section id="registro">
        <div class="form-group">
            <label for="nombre">Nombre del Estudiante</label>
            <input type="text" id="nombre" placeholder="Tu nombre completo">
            <label for="fecha">Fecha de Realización</label>
            <input type="date" id="fecha">
        </div>
        <button class="btn" onclick="startQuiz()">Iniciar Evaluación</button>
    </section>

    <section id="actividad" class="hidden">
        <div class="stats-bar">
            <div class="stat-item">✅ <span id="correct-count">0</span></div>
            <div class="stat-item">❌ <span id="error-count">0</span>/10</div>
            <div class="stat-item">📊 <span id="progress-pct">0%</span></div>
        </div>
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div id="question-container">
            <div class="question-box">
                <p class="question-text" id="q-text"></p>
                <div class="options" id="options-container"></div>
                <div id="feedback" class="feedback"></div>
            </div>
            <button class="btn btn-next" id="btn-next" onclick="nextQuestion()" disabled>Siguiente</button>
        </div>
    </section>

    <section id="resultados" class="hidden">
        <div class="results-box">
            <h2>Resultado para <span id="student-name-display"></span></h2>
            <div class="score-circle" id="final-score">0%</div>
            <div id="personal-message" style="margin: 20px 0; font-size: 1.1rem;"></div>
            <button class="btn" onclick="location.reload()">Reiniciar Actividad</button>
        </div>
    </section>
</div>

<script>
    // 20 reactivos tomados de los ejercicios propuestos de REGLA DE LA CADENA
    const questions = [
        // ==================== SECCIÓN 1: Cadena con potencias ====================
        {
            q: "Para $f(x) = (x + 1)^2$, encuentre $f'(x)$ usando la regla de la cadena.",
            options: ["$2(x+1)$", "$(x+1)^2$", "$2x+2$", "$2(x+1)$"],
            correct: 0,
            explanation: "Función externa: $u^2$, interna: $u=x+1$. $f'(x)=2(x+1)\\cdot 1=2(x+1)$."
        },
        {
            q: "Para $f(x) = (2x - 3)^3$, encuentre $f'(x)$ usando la regla de la cadena.",
            options: ["$6(2x-3)^2$", "$3(2x-3)^2$", "$6(2x-3)^3$", "$2(2x-3)^2$"],
            correct: 0,
            explanation: "Externa: $u^3$, interna: $u=2x-3$. $f'=3(2x-3)^2\\cdot 2=6(2x-3)^2$."
        },
        {
            q: "Para $f(x) = (x^2 + 1)^2$, encuentre $f'(x)$ usando la regla de la cadena.",
            options: ["$4x(x^2+1)$", "$2(x^2+1)$", "$4x(x^2+1)^2$", "$2x(x^2+1)$"],
            correct: 0,
            explanation: "Externa: $u^2$, interna: $u=x^2+1$. $f'=2(x^2+1)\\cdot 2x=4x(x^2+1)$."
        },
        {
            q: "Para $f(x) = (3x + 2)^4$, encuentre $f'(x)$ usando la regla de la cadena.",
            options: ["$12(3x+2)^3$", "$4(3x+2)^3$", "$12(3x+2)^4$", "$3(3x+2)^3$"],
            correct: 0,
            explanation: "Externa: $u^4$, interna: $u=3x+2$. $f'=4(3x+2)^3\\cdot 3=12(3x+2)^3$."
        },
        {
            q: "Para $f(x) = (x^3 - 1)^2$, encuentre $f'(x)$ usando la regla de la cadena.",
            options: ["$6x^2(x^3-1)$", "$2(x^3-1)$", "$6x^2(x^3-1)^2$", "$3x^2(x^3-1)$"],
            correct: 0,
            explanation: "Externa: $u^2$, interna: $u=x^3-1$. $f'=2(x^3-1)\\cdot 3x^2=6x^2(x^3-1)$."
        },
        {
            q: "Para $f(x) = (2x^2 + x)^3$, encuentre $f'(x)$ usando la regla de la cadena.",
            options: ["$3(2x^2+x)^2(4x+1)$", "$3(2x^2+x)^2$", "$(2x^2+x)^2(4x+1)$", "$3(2x^2+x)^2(2x+1)$"],
            correct: 0,
            explanation: "Externa: $u^3$, interna: $u=2x^2+x$. $f'=3(2x^2+x)^2\\cdot (4x+1)$."
        },

        // ==================== SECCIÓN 2: Cadena con exponenciales y logaritmos ====================
        {
            q: "Para $f(x) = e^{2x}$, encuentre $f'(x)$ usando la regla de la cadena.",
            options: ["$2e^{2x}$", "$e^{2x}$", "$e^{2x}\\cdot 2x$", "$2xe^{2x}$"],
            correct: 0,
            explanation: "Externa: $e^u$, interna: $u=2x$. $f'=e^{2x}\\cdot 2=2e^{2x}$."
        },
        {
            q: "Para $f(x) = e^{x^2}$, encuentre $f'(x)$ usando la regla de la cadena.",
            options: ["$2xe^{x^2}$", "$e^{x^2}$", "$x^2e^{x^2}$", "$2xe^{x}$"],
            correct: 0,
            explanation: "Externa: $e^u$, interna: $u=x^2$. $f'=e^{x^2}\\cdot 2x=2xe^{x^2}$."
        },
        {
            q: "Para $f(x) = \\ln(2x)$, encuentre $f'(x)$ usando la regla de la cadena.",
            options: ["$\\frac{1}{x}$", "$\\frac{1}{2x}$", "$\\frac{2}{x}$", "$\\frac{1}{2}$"],
            correct: 0,
            explanation: "Externa: $\\ln u$, interna: $u=2x$. $f'=\\frac{1}{2x}\\cdot 2=\\frac{1}{x}$."
        },
        {
            q: "Para $f(x) = \\ln(x^2 + 1)$, encuentre $f'(x)$ usando la regla de la cadena.",
            options: ["$\\frac{2x}{x^2+1}$", "$\\frac{1}{x^2+1}$", "$\\frac{2x}{x^2+1}$", "$\\frac{x}{x^2+1}$"],
            correct: 0,
            explanation: "Externa: $\\ln u$, interna: $u=x^2+1$. $f'=\\frac{1}{x^2+1}\\cdot 2x=\\frac{2x}{x^2+1}$."
        },
        {
            q: "Para $f(x) = e^{x + 1}$, encuentre $f'(x)$ usando la regla de la cadena.",
            options: ["$e^{x+1}$", "$(x+1)e^{x}$", "$e^{x+1}(x+1)$", "$e^{x}$"],
            correct: 0,
            explanation: "Externa: $e^u$, interna: $u=x+1$. $f'=e^{x+1}\\cdot 1=e^{x+1}$."
        },
        {
            q: "Para $f(x) = \\ln(3x - 1)$, encuentre $f'(x)$ usando la regla de la cadena.",
            options: ["$\\frac{3}{3x-1}$", "$\\frac{1}{3x-1}$", "$\\frac{3x}{3x-1}$", "$\\frac{3}{3x-1}$"],
            correct: 0,
            explanation: "Externa: $\\ln u$, interna: $u=3x-1$. $f'=\\frac{1}{3x-1}\\cdot 3=\\frac{3}{3x-1}$."
        },

        // ==================== SECCIÓN 3: Cadena con trigonométricas ====================
        {
            q: "Para $f(x) = \\sin(2x)$, encuentre $f'(x)$ usando la regla de la cadena.",
            options: ["$2\\cos(2x)$", "$\\cos(2x)$", "$-2\\cos(2x)$", "$2\\sin(2x)$"],
            correct: 0,
            explanation: "Externa: $\\sin u$, interna: $u=2x$. $f'=\\cos(2x)\\cdot 2=2\\cos(2x)$."
        },
        {
            q: "Para $f(x) = \\cos(x^2)$, encuentre $f'(x)$ usando la regla de la cadena.",
            options: ["$-2x\\sin(x^2)$", "$2x\\sin(x^2)$", "$-\\sin(x^2)$", "$-2x\\cos(x^2)$"],
            correct: 0,
            explanation: "Externa: $\\cos u$, interna: $u=x^2$. $f'=-\\sin(x^2)\\cdot 2x=-2x\\sin(x^2)$."
        },
        {
            q: "Para $f(x) = \\sin(x^2 + 1)$, encuentre $f'(x)$ usando la regla de la cadena.",
            options: ["$2x\\cos(x^2+1)$", "$\\cos(x^2+1)$", "$2x\\cos(x^2)$", "$2x\\sin(x^2+1)$"],
            correct: 0,
            explanation: "Externa: $\\sin u$, interna: $u=x^2+1$. $f'=\\cos(x^2+1)\\cdot 2x=2x\\cos(x^2+1)$."
        },
        {
            q: "Para $f(x) = \\cos(3x - 1)$, encuentre $f'(x)$ usando la regla de la cadena.",
            options: ["$-3\\sin(3x-1)$", "$3\\sin(3x-1)$", "$-\\sin(3x-1)$", "$-3\\cos(3x-1)$"],
            correct: 0,
            explanation: "Externa: $\\cos u$, interna: $u=3x-1$. $f'=-\\sin(3x-1)\\cdot 3=-3\\sin(3x-1)$."
        },
        {
            q: "Para $f(x) = \\tan(x^2)$, encuentre $f'(x)$ usando la regla de la cadena.",
            options: ["$2x\\sec^2(x^2)$", "$\\sec^2(x^2)$", "$2x\\tan(x^2)$", "$x\\sec^2(x^2)$"],
            correct: 0,
            explanation: "Externa: $\\tan u$, interna: $u=x^2$. $f'=\\sec^2(x^2)\\cdot 2x=2x\\sec^2(x^2)$."
        },
        {
            q: "Para $f(x) = \\sin(e^x)$, encuentre $f'(x)$ usando la regla de la cadena.",
            options: ["$e^x\\cos(e^x)$", "$\\cos(e^x)$", "$e^x\\sin(e^x)$", "$\\cos(e^x)\\cdot e^x$"],
            correct: 0,
            explanation: "Externa: $\\sin u$, interna: $u=e^x$. $f'=\\cos(e^x)\\cdot e^x=e^x\\cos(e^x)$."
        },

        // ==================== SECCIÓN 4: Cadenas anidadas ====================
        {
            q: "Para $f(x) = \\sin^2(x)$ (es decir, $(\\sin x)^2$), encuentre $f'(x)$ usando la regla de la cadena.",
            options: ["$2\\sin(x)\\cos(x)$", "$2\\sin(x)$", "$\\sin(x)\\cos(x)$", "$2\\cos(x)\\sin(x)$"],
            correct: 0,
            explanation: "Externa: $u^2$, interna: $u=\\sin x$. $f'=2\\sin(x)\\cdot \\cos(x)=2\\sin(x)\\cos(x)$."
        },
        {
            q: "Para $f(x) = e^{x^2 + 1}$, encuentre $f'(x)$ usando la regla de la cadena.",
            options: ["$2xe^{x^2+1}$", "$e^{x^2+1}$", "$2xe^{x^2}$", "$(x^2+1)e^{x^2+1}$"],
            correct: 0,
            explanation: "Externa: $e^u$, interna: $u=x^2+1$. $f'=e^{x^2+1}\\cdot 2x=2xe^{x^2+1}$."
        },
        {
            q: "Para $f(x) = \\ln[\\sin(2x)]$, encuentre $f'(x)$ usando la regla de la cadena.",
            options: ["$2\\cot(2x)$", "$\\frac{2}{\\sin(2x)}$", "$2\\tan(2x)$", "$\\frac{\\cos(2x)}{\\sin(2x)}$"],
            correct: 0,
            explanation: "Externa: $\\ln u$, interna: $u=\\sin(2x)$. $f'=\\frac{1}{\\sin(2x)}\\cdot \\cos(2x)\\cdot 2=2\\cot(2x)$."
        },
        {
            q: "Para $f(x) = \\sin[(x^2 + 1)^2]$, encuentre $f'(x)$ usando la regla de la cadena.",
            options: ["$4x(x^2+1)\\cos[(x^2+1)^2]$", "$2x\\cos[(x^2+1)^2]$", "$4x(x^2+1)\\sin[(x^2+1)^2]$", "$2(x^2+1)\\cos[(x^2+1)^2]$"],
            correct: 0,
            explanation: "Externa: $\\sin u$, interna: $u=(x^2+1)^2$. $f'=\\cos[(x^2+1)^2]\\cdot 2(x^2+1)\\cdot 2x=4x(x^2+1)\\cos[(x^2+1)^2]$."
        }
    ];

    let currentQ = 0;
    let correctCount = 0;
    let errorCount = 0;
    let studentName = "";
    let answered = false;
    const MAX_ERRORS = 10;

    // Establecer fecha de hoy por defecto
    const fechaInput = document.getElementById('fecha');
    if (fechaInput) {
        const hoy = new Date();
        const año = hoy.getFullYear();
        const mes = String(hoy.getMonth() + 1).padStart(2, '0');
        const dia = String(hoy.getDate()).padStart(2, '0');
        fechaInput.value = `${año}-${mes}-${dia}`;
    }

    function startQuiz() {
        const nameInput = document.getElementById('nombre').value.trim();
        const dateInput = document.getElementById('fecha').value;
        if(!nameInput || !dateInput) {
            alert("Por favor, ingresa tu nombre y la fecha.");
            return;
        }
        studentName = nameInput;
        document.getElementById('registro').classList.add('hidden');
        document.getElementById('actividad').classList.remove('hidden');
        loadQuestion();
    }

    function loadQuestion() {
        answered = false;
        const q = questions[currentQ];
        document.getElementById('q-text').innerHTML = `<strong>Pregunta ${currentQ + 1}:</strong><br>${q.q}`;
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        
        q.options.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = opt;
            btn.onclick = () => selectOption(i, btn);
            container.appendChild(btn);
        });
        document.getElementById('feedback').style.display = 'none';
        document.getElementById('btn-next').disabled = true;
        updateStats();
        
        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise();
        }
    }

    function selectOption(index, btn) {
        if(answered) return;
        document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        document.getElementById('btn-next').disabled = false;
        btn.dataset.index = index;
    }

    function nextQuestion() {
        if(!answered) {
            const selected = document.querySelector('.option-btn.selected');
            if(!selected) {
                alert("Por favor, selecciona una respuesta antes de continuar.");
                return;
            }
            const idx = parseInt(selected.dataset.index);
            checkAnswer(idx);
            answered = true;
            document.getElementById('btn-next').innerText = (currentQ < questions.length - 1) ? "Siguiente Pregunta" : "Finalizar";
            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise();
            }
        } else {
            currentQ++;
            if(currentQ < questions.length) {
                loadQuestion();
                document.getElementById('btn-next').innerText = "Siguiente";
            } else {
                showResults();
            }
        }
    }

    function checkAnswer(selectedIdx) {
        const q = questions[currentQ];
        const isCorrect = selectedIdx === q.correct;
        const feedback = document.getElementById('feedback');
        const btns = document.querySelectorAll('.option-btn');

        btns.forEach(b => b.classList.add('disabled'));
        btns[q.correct].classList.add('correct');

        if(isCorrect) {
            correctCount++;
            feedback.className = "feedback correct";
            feedback.innerHTML = "<strong>¡Excelente!</strong> " + q.explanation;
        } else {
            errorCount++;
            btns[selectedIdx].classList.add('incorrect');
            feedback.className = "feedback incorrect";
            feedback.innerHTML = "<strong>Incorrecto.</strong> " + q.explanation;
            
            if(errorCount >= MAX_ERRORS) {
                setTimeout(() => {
                    alert(`Has alcanzado el límite de ${MAX_ERRORS} errores. Te recomendamos repasar: identificación de función interna/externa, derivada de la externa evaluada en la interna, y multiplicación por la derivada de la interna.`);
                    location.reload();
                }, 1500);
            }
        }
        feedback.style.display = 'block';
        updateStats();
    }

    function updateStats() {
        document.getElementById('correct-count').innerText = correctCount;
        document.getElementById('error-count').innerText = errorCount;
        const prog = Math.round((currentQ / questions.length) * 100);
        document.getElementById('progress-pct').innerText = prog + "%";
        document.getElementById('progress-bar').style.width = prog + "%";
    }

    function showResults() {
        document.getElementById('actividad').classList.add('hidden');
        document.getElementById('resultados').classList.remove('hidden');
        document.getElementById('student-name-display').innerText = studentName;
        const score = Math.round((correctCount / questions.length) * 100);
        document.getElementById('final-score').innerText = score + "%";
        
        let msg = score >= 80 ? 
            "¡Excelente trabajo! Dominas la regla de la cadena: identificación de funciones internas/externas, aplicación correcta y simplificación." : 
            "Buen esfuerzo. Te sugerimos repasar: la regla de la cadena $\\frac{d}{dx}[f(g(x))] = f'(g(x))\\cdot g'(x)$, identificando correctamente la función externa e interna, y practicar con potencias, exponenciales, logaritmos y funciones trigonométricas.";
        document.getElementById('personal-message').innerText = msg;
    }
</script>
</body>
</html>
